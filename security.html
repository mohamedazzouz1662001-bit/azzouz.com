<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZZOUZ Security — فحص أمان الموقع</title>
<meta name="theme-color" content="#04060b">
<style>
:root{--bg:#04060b;--card:#0a1218;--line:#1d2b35;--txt:#e8f1ff;--dim:#8fa3b5;--g:#00e5a0;--b:#00b3ff;--r:#ff6b6b;--gold:#d4af37}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(700px 420px at 50% -10%,#231016,#04060b 65%);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:14px 12px 36px}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:17px;text-align:center;margin:6px 0 4px}
.sub{color:var(--dim);font-size:12px;text-align:center;margin-bottom:14px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}
.t{font-weight:700;font-size:13.5px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.badge{font-size:10.5px;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--dim)}
.f{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed #14212a;font-size:12.5px;line-height:1.6}
.f:last-child{border:0}
.f .ic{flex:none}
.f .x{flex:1;min-width:0;word-break:break-word}
.f .x b{color:#dbeaf5}
.f .x small{color:var(--dim);display:block;font-size:11.5px;margin-top:2px}
.ok{color:var(--g)}.bad{color:var(--r)}.warn{color:var(--gold)}
.btn{display:block;width:100%;background:#08222b;border:1px solid #164c5c;color:#9fe8ff;border-radius:11px;padding:12px;font-size:13px;font-weight:700;font-family:inherit;margin-bottom:10px}
a{color:var(--b);text-decoration:none}
pre{background:#071016;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11.5px;overflow:auto;direction:ltr;text-align:left;color:#cfe3ee;margin:6px 0}
</style></head>
<body>
<div class="wrap">
  <h1>🛡️ فحص أمان الموقع</h1>
  <div class="sub">كيفحص الموقع ديالك بوحدو: ملفات مكشوفة، أسرار فالكوميت، محتوى مختلط، وروابط خطيرة. كلشي فالمتصفح، بلا سيرفر.</div>

  <button class="btn" id="run">⚡ بدا الفحص</button>

  <div class="card"><div class="t">1. ملفات خاصها ما تكونش عمومية</div><div id="r1" class="sub" style="text-align:right;margin:0">—</div></div>
  <div class="card"><div class="t">2. أسرار فالملفات</div><div id="r2" class="sub" style="text-align:right;margin:0">—</div></div>
  <div class="card"><div class="t">3. محتوى مختلط وروابط خطيرة</div><div id="r3" class="sub" style="text-align:right;margin:0">—</div></div>
  <div class="card"><div class="t">4. توصيات فورية</div><div id="r4" class="sub" style="text-align:right;margin:0">—</div></div>

  <div class="sub" style="margin-top:8px"><a href="./apps.html">كل الأدوات</a> · <a href="./computer.html">الحاسوب</a></div>
</div>

<script>
const BASE = location.origin + location.pathname.replace(/[^/]*$/, '');
const SENSITIVE = ['NEW_KEY.txt', '.env', 'data/memory.json', 'data/topics.json', 'results.json', 'repos.json', 'azzouz-computer.mjs', 'boxhunter.mjs', 'boxhunter-v20-backup.mjs', '__pycache__/'];
const PAGES = ['index.html', 'apps.html', 'azzouz-ai.html', 'term.html', 'hacker.html', 'computer.html', 'spy.html', 'calculator.html', 'portfolio.html'];
const SECRET_RE = /(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|AZZOUZ-[a-f0-9]{8,}|client_secret\s*[:=]\s*["'][^"']{8,}["']|password\s*[:=]\s*["'][^"']{6,}["'])/gi;

function item(host, icon, title, note, cls) {
  const d = document.createElement('div');
  d.className = 'f';
  d.innerHTML = '<span class="ic ' + (cls || '') + '">' + icon + '</span><span class="x"><b>' + title + '</b>' + (note ? '<small>' + note + '</small>' : '') + '</span>';
  const box = document.getElementById(host);
  if (box.textContent.trim() === '—') box.textContent = '';
  box.appendChild(d);
}

async function checkSensitive() {
  for (const p of SENSITIVE) {
    try {
      const r = await fetch(BASE + p + '?t=' + Date.now(), { method: 'GET' });
      if (r.ok) item('r1', '⛔', p + ' مكشوف', 'أي واحد كيقدر يقراه من الأنترنت (HTTP ' + r.status + ')', 'bad');
      else item('r1', '✅', p + ' محمي', 'HTTP ' + r.status, 'ok');
    } catch (e) { item('r1', '✅', p + ' ما وصلش', 'ما كاينش ولا محمي', 'ok'); }
  }
}

async function checkSecrets() {
  let hits = 0;
  for (const p of PAGES) {
    try {
      const r = await fetch(BASE + p + '?t=' + Date.now());
      if (!r.ok) continue;
      const html = await r.text();
      const m = html.match(SECRET_RE);
      if (m && m.length) {
        hits += m.length;
        item('r2', '⛔', p + ': ' + m.length + ' سر محتمل', m.slice(0, 3).map(x => x.slice(0, 12) + '…').join(' · '), 'bad');
      }
    } catch (e) {}
  }
  if (!hits) item('r2', '✅', 'ما لقيتش أسرار فالصفحات', 'افحص كذلك ملفات .mjs و.txt', 'ok');
}

async function checkMixed() {
  let mixed = 0, blank = 0;
  for (const p of PAGES) {
    try {
      const r = await fetch(BASE + p + '?t=' + Date.now());
      if (!r.ok) continue;
      const html = await r.text();
      const httpLinks = (html.match(/src=["']http:\/\//gi) || []).length + (html.match(/href=["']http:\/\//gi) || []).length;
      const unsafeBlank = (html.match(/target=["']_blank["'](?![^>]*rel=["'][^"']*noopener)/gi) || []).length;
      if (httpLinks) { mixed += httpLinks; item('r3', '⚠️', p + ': ' + httpLinks + ' رابط HTTP', 'خاصهم يولي HTTPS', 'warn'); }
      if (unsafeBlank) { blank += unsafeBlank; item('r3', '⚠️', p + ': ' + unsafeBlank + ' رابط بلا noopener', 'زيد rel="noopener"', 'warn'); }
    } catch (e) {}
  }
  if (!mixed && !blank) item('r3', '✅', 'ما كاين حتى محتوى مختلط', 'كل الروابط HTTPS وسليمة', 'ok');
}

function recommendations() {
  const list = [
    'إلا كان شي ملف مكشوف (بحال NEW_KEY.txt)، حيدو من المستودع وبدل المفتاح فورا.',
    'ما تحطش أبدا مفاتيح ولا tokens فـHTML ولا JS، خليهم فالسيرفر ولا فمتغيرات البيئة.',
    'خلي rel="noopener" فكل رابط target="_blank".',
    'استعمل HTTPS فكل شي، وما تخلطش http داخل صفحة https.'
  ];
  const box = document.getElementById('r4');
  box.textContent = '';
  list.forEach(x => item('r4', '•', x, '', ''));
}

document.getElementById('run').onclick = async () => {
  document.getElementById('run').disabled = true;
  document.getElementById('run').textContent = '⏳ كنفحص…';
  ['r1', 'r2', 'r3', 'r4'].forEach(id => document.getElementById(id).textContent = '—');
  await checkSensitive();
  await checkSecrets();
  await checkMixed();
  recommendations();
  document.getElementById('run').textContent = '✅ الفحص سالا · عاود';
  document.getElementById('run').disabled = false;
};
</script>
</body></html>
