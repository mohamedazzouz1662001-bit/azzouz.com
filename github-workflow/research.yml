name: باحث أزوز

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      topics:
        description: 'مواضيع مفصولة بفاصلة (اختياري)'
        required: false

permissions:
  contents: write

concurrency:
  group: azzouz-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: تشغيل البحث
        run: |
          if [ -n "${{ github.event.inputs.topics }}" ]; then
            node -e "const fs=require('fs');fs.writeFileSync('data/topics.json',JSON.stringify('${{ github.event.inputs.topics }}'.split(',').map(s=>s.trim()).filter(Boolean),null,1))"
          fi
          node scripts/research-cron.mjs
      - name: تسجيل النتائج
        run: |
          git config user.name "azzouz-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/memory.json data/topics.json
          git diff --quiet --cached || git commit -m "بحث تلقائي: تحديث الذاكرة"
          git push
