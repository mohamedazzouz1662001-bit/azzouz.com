<script>
/* ===== أدوات ===== */
const $ = id => document.getElementById(id);
const log = $('log'), qEl = $('q'), statusEl = $('status');
const enc = encodeURIComponent;
let busy = false, LAST = null;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function clean(h) { return String(h || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }
function now() { const d = new Date(); return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0'); }
function tick() { return '✓✓'; }

async function jget(url, ms = 9000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error('x'); return await r.json(); }
  finally { clearTimeout(t); }
}
const PROXY = 'https://superagent-1906c8e6.base44.app/functions/azzouzProxy';
async function readViaProxy(url, ms = 16000) {
  try {
    const r = await fetch(PROXY, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }), signal: AbortSignal.timeout(ms) });
    const j = await r.json();
    return j && j.ok ? String(j.text || '') : '';
  } catch (e) { return ''; }
}
async function jtxt(url, ms = 15000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error('x'); return await r.text(); }
  finally { clearTimeout(t); }
}
function invAbs(idx) {
  if (!idx) return '';
  const arr = [];
  Object.keys(idx).forEach(w => idx[w].forEach(p => { arr[p] = w; }));
  return arr.filter(Boolean).join(' ');
}

/* ===== الذاكرة ===== */
let DB = null, memory = [];
const DB_NAME = 'azzouz-brain-v3';
function initDB() {
  try {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('memories')) db.createObjectStore('memories', { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = e => { DB = e.target.result; loadMem(); };
    req.onerror = () => loadMem();
  } catch (e) { loadMem(); }
}
function loadMem() {
  try { memory = JSON.parse(localStorage.getItem('azzouz-mem-v3') || '[]'); } catch (e) { memory = []; }
  refreshMemCount();
  if (DB) {
    try {
      const rq = DB.transaction('memories', 'readonly').objectStore('memories').getAll();
      rq.onsuccess = () => { if (rq.result && rq.result.length) { memory = rq.result; refreshMemCount(); } };
    } catch (e) {}
  }
}
function refreshMemCount() { $('status').dataset.mem = memory.length; }
function persistMem() {
  try { localStorage.setItem('azzouz-mem-v3', JSON.stringify(memory.slice(-120))); } catch (e) {}
  if (DB) { try { DB.transaction('memories', 'readwrite').objectStore('memories').put(memory[memory.length - 1]); } catch (e) {} }
}
function topicOf(q) {
  const t = String(q || '').toLowerCase().replace(/[؟?.,،!]/g, ' ').replace(/\s+/g, ' ').trim();
  const w = t.split(' ').filter(x => x.length > 2 && !['ما', 'هو', 'هي', 'شنو', 'كيفاش', 'كيف', 'على', 'عن', 'في', 'من', 'the', 'what', 'how'].includes(x));
  return w.slice(0, 3).join(' ') || t.slice(0, 20);
}
function findPrior(q) {
  const t = topicOf(q), ws = t.split(' ');
  let best = null, score = 0;
  memory.forEach(m => {
    let s = 0;
    if (m.topic === t) s = 1;
    else {
      const mw = String(m.topic || '').split(' ');
      const hit = mw.filter(x => ws.includes(x)).length;
      s = mw.length ? hit / Math.max(mw.length, ws.length) : 0;
    }
    if (s > score) { score = s; best = m; }
  });
  return score >= 0.6 ? best : null;
}

/* ===== قراءة الويب: محركات ===== */
function extractKeyword(q) {
  const map = { 'ثقب': 'السماء', 'نحل': 'النحل', 'نمل': 'النمل', 'نور': 'النور', 'سماء': 'السماء', 'حديد': 'الحديد', 'علم': 'العلم', 'قلب': 'القلب', 'قرآن': 'القرآن', 'طاقة': 'الطاقة', 'ماء': 'الماء', 'أرض': 'الأرض', 'رحمة': 'الرحمة' };
  for (const k in map) if (q.includes(k)) return map[k];
  const w = q.split(/\s+/).filter(x => x.length > 2 && /[\u0600-\u06FF]/.test(x));
  return w[0] || null;
}
function englishOf(q) {
  const g = { 'النحل': 'honey bee', 'الصيام المتقطع': 'intermittent fasting', 'الزليج': 'zellige', 'التشفير': 'encryption', 'الذكاء الاصطناعي': 'artificial intelligence', 'ضغط البيانات': 'data compression', 'الثقب الأسود': 'black hole', 'الطاقة': 'energy', 'الماء': 'water' };
  for (const k in g) if (q.includes(k)) return g[k];
  return q;
}
function realU(u) {
  try { const m = /uddg=([^&]+)/.exec(u); if (m) return decodeURIComponent(m[1]); } catch (e) {}
  return u;
}
function parseLinks(md, engine) {
  const out = [], re = /\[([^\]\n]{10,150})\]\((https?:\/\/[^)\s]+)\)/g;
  let m;
  while ((m = re.exec(md))) {
    const title = clean(m[1]), url = realU(m[2]);
    if (/jina\.ai|bing\.com\/ck|duckduckgo\.com\/l|google\.com\/search|startpage\.com|qwant\.com|ecosia\.org/.test(url)) continue;
    if (title.length < 12) continue;
    out.push({ name: '🌐 ' + engine, title: title.slice(0, 140), text: '', url, weight: 6 });
  }
  return out;
}

async function tiktokLink(text) {
  const m = String(text || '').match(/https?:\/\/(?:www\.)?tiktok\.com\/[^\s)]+/);
  if (!m) return null;
  const url = m[0];
  try {
    const d = await jget('https://www.tiktok.com/oembed?url=' + encodeURIComponent(url), 12000);
    if (d && d.title) return { name: '\uD83C\uDFB5 TikTok', title: String(d.author_name || 'TikTok') + ' \u00b7 ' + String(d.title).slice(0, 80), text: String(d.title).slice(0, 300), url, weight: 9 };
  } catch (e) {}
  try {
    const md = await jtxt('https://r.jina.ai/' + url, 16000);
    const lines = String(md || '').split('\n').map(l => l.replace(/\[[^\]]*\]\([^)]*\)|\*/g, ' ').replace(/\s+/g, ' ').trim()).filter(l => l.length > 25 && !/TikTok Shop|Log in|For You|Explore|Search|Cookies/i.test(l));
    if (lines.length) return { name: '\uD83C\uDFB5 TikTok', title: lines[0].slice(0, 90), text: lines.slice(0, 3).join(' ').slice(0, 400), url, weight: 9 };
  } catch (e) {}
  return null;
}

async function gather(q, tickFn) {
  const S = [], en = englishOf(q), seen = new Set();
  const push = o => {
    if (!o || !o.title) return;
    const k = String(o.url || o.title).split('#')[0];
    if (seen.has(k)) return;
    seen.add(k);

function firstSentence(t) {
  const s = clean(t);
  if (!s) return '';
  const m = s.match(/^(.{40,190}?[.!؟])\s/);
  return m ? m[1] : s.slice(0, 170);
}

async function fillSnippets(S, tickFn) {
  const need = S.filter(o => !o.text || o.text.length < 40).slice(0, 24);
  let i = 0;
  async function w() {
    while (i < need.length) {
      const o = need[i++];
      if (!o.url || !/^https?:/.test(o.url)) continue;
      try {
        let md = await jtxt('https://r.jina.ai/' + o.url, 12000).catch(() => '');
        if (!md) md = await readViaProxy(o.url, 15000);
        const txt = md.split('\n').map(l => l.trim())
          .filter(l => l.length > 80 && !/^(URL Source|Title|Markdown Content|Published Time|Description):/i.test(l))
          .slice(0, 2).join(' ');
        if (txt) o.text = txt.slice(0, 340);
      } catch (e) {}
      if (tickFn) tickFn(S.length);
    }
  }
  await Promise.all([w(), w(), w()]);
  S.forEach(o => { o.sum = firstSentence(o.text); });
}


function termsOf(q, en) {
  const t = (q + ' ' + (en || '')).toLowerCase();
  return [...new Set(t.split(/[^\p{L}\p{N}]+/u).filter(w => w.length > 3))];
}
function matchScore(o, terms) {
  const t = (o.title + ' ' + (o.text || '')).toLowerCase();
  let n = 0;
  for (const k of terms) if (t.includes(k)) n++;
  return n;
}

/* ===== جودة المصادر ===== */
const TRUST = ['wikipedia.org', 'arxiv.org', 'doi.org', 'ncbi.nlm.nih.gov', 'europepmc.org', 'who.int', 'un.org', 'worldbank.org', '.gov', '.edu', 'github.com', 'openlibrary.org', 'archive.org', 'hal.science', 'zenodo.org', 'openalex.org', 'crossref.org', 'semanticscholar.org', 'stackoverflow.com', 'nature.com', 'sciencedirect.com', 'springer.com', 'mdpi.com', 'quran.com', 'alquran.cloud'];
const SPAM = ['pinterest', 'quora', 'facebook.com', 'instagram.com', 'casino', 'betting', 'escort', 'porn', 'crack', 'download-free'];
function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
function trustScore(s) {
  const h = hostOf(s.url || '');
  const t = String(s.title || '').toLowerCase();
  if (SPAM.some(x => h.includes(x) || t.includes(x))) return -14;
  if (TRUST.some(x => h.endsWith(x) || h.includes(x))) return 10;
  return 0;
}
function dedupeSources(list) {
  const out = [], seen = [];
  const sig = s => new Set(String(s.title || '').toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w => w.length > 3));
  for (const s of list) {
    const a = sig(s);
    if (!a.size) { out.push(s); continue; }
    let dup = false;
    for (const b of seen) {
      let inter = 0;
      a.forEach(w => { if (b.has(w)) inter++; });
      if (inter / Math.max(1, Math.min(a.size, b.size)) > 0.8) { dup = true; break; }
    }
    if (!dup) { out.push(s); seen.push(a); }
    if (seen.length > 400) seen.shift();
  }
  return out;
}


/* ===== العقل: تفكيك الجمل وتجميع الأفكار ===== */
const NOISE = /(انتقل إلى المحتوى|تصفح من غير|تسجيل الدخول|سياسة الخصوصية|جميع الحقوق|اقرأ المزيد|اضغط هنا|تخطى إلى|Cookie|subscribe|newsletter|حساب جديد|رمز التحقق)/i;
const DEFINE = /(\sهو\s|\sهي\s|\sهما\s|عبارة عن|\sيعني\s|يُعرف|تُعرف|is an?\s|are a\s|refers to|is defined|consists of)/i;

function sentencesOf(txt) {
  const flat = String(txt || '').replace(/\s+/g, ' ').replace(/\[[^\]]{0,40}\]/g, ' ').trim();
  return flat.split(/(?<=[.!?؟])\s+|\s+[·•]\s+|(?<=[،])\s+(?=[A-Za-z\u0600-\u06FF]{4,}\s)/)
    .map(s => s.replace(/^[\s\-–—*]+/, '').trim())
    .filter(s => s.length >= 45 && s.length <= 320);
}

function sigWords(s) {
  return new Set(String(s).toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w => w.length > 3));
}

function sentScore(s, terms) {
  const t = s.toLowerCase();
  let sc = 0;
  terms.forEach(w => { if (w && w.length > 2 && t.includes(w)) sc += 3; });
  if (DEFINE.test(s)) sc += 5;
  if (/^\d+[.)]/.test(s)) sc -= 4;
  if (NOISE.test(s)) sc -= 25;
  if (/\d{4}/.test(s)) sc += 1;
  if (s.length > 90 && s.length < 240) sc += 2;
  if ((s.match(/\p{L}/gu) || []).length / s.length < 0.6) sc -= 6;
  return sc;
}

function clusterClaims(cands) {
  const groups = [];
  cands.forEach(c => {
    const a = sigWords(c.text);
    let g = null;
    for (const gr of groups) {
      const b = sigWords(gr.text);
      let inter = 0;
      a.forEach(w => { if (b.has(w)) inter++; });
      if (inter / Math.max(1, Math.min(a.size, b.size)) > 0.35) { g = gr; break; }
    }
    if (g) {
      g.support++;
      if (c.score > g.score) { g.text = c.text; g.src = c.src; g.score = c.score; }
    } else {
      groups.push({ text: c.text, src: c.src, score: c.score, support: 1 });
    }
  });
  return groups.sort((x, y) => (y.support - x.support) || (y.score - x.score));
}

function think(q, sources, terms, prior) {
  const cands = [];
  sources.forEach(s => {
    sentencesOf(s.text || s.sum || '').forEach(txt => {
      const sc = sentScore(txt, terms) + Math.min(6, (s.weight || 0) / 2) + trustScore(s) / 3;
      if (sc > 0) cands.push({ text: txt, src: s.name, score: sc });
    });
  });
  const claims = clusterClaims(cands).filter(c => c.score > 2).slice(0, 6);
  const agreements = claims.filter(c => c.support >= 2).length;
  const nums = new Set();
  claims.slice(0, 3).forEach(c => (c.text.match(/\d[\d.,]{1,12}/g) || []).forEach(n => nums.add(n)));
  return {
    claims,
    agreements,
    numbers: Array.from(nums).slice(0, 6),
    intent: intentOf(q),
    confidence: claims.length ? Math.min(97, 34 + agreements * 12 + Math.min(20, claims[0].score * 2)) : 0
  };
}

function intentOf(q) {
  const t = String(q).toLowerCase();
  if (/كيفاش|كيف |how to|طريقة/.test(t)) return 'how';
  if (/علاش|لماذا|why|سبب/.test(t)) return 'why';
  if (/شنو الفرق|الفرق بين|مقارنة|vs|versus|أفضل|احسن/.test(t)) return 'compare';
  if (/^(من هو|من هي|شكون|who is)/.test(t)) return 'who';
  if (/(ثمن|سعر|price|بشحال|تكلفة)/.test(t)) return 'price';
  if (/(أخبار|النهار|اليوم|2026|news)/.test(t)) return 'news';
  if (/(تطبيق|app|برنامج|برمجة|code|python|javascript)/.test(t)) return 'tech';
  return 'what';
}

function shapeByIntent(intent, claims, q) {
  if (!claims.length) return null;
  const lead = claims[0].text.trim();
  if (intent === 'how') return 'الطريقة باختصار: ' + lead;
  if (intent === 'why') return 'السبب الأساسي: ' + lead;
  if (intent === 'compare') return 'الفرق كيبان فهادشي: ' + lead;
  if (intent === 'price') return 'بخصوص الثمن: ' + lead;
  return lead;
}

function synthesize(q, sources, prior) {
  const terms = termsOf(q, englishOf(q));
  const score = s => (s.weight || 0) + 6 * matchScore(s, terms) + trustScore(s) + (String(s.title || '').includes(q) ? 12 : 0);
  const sorted = dedupeSources(sources.slice().sort((a, b) => score(b) - score(a)));
  const rich = sorted.filter(s => (s.text || '').length > 40 && matchScore(s, terms) > 0);

  const shortOf = s => {
    let c = clause(s.text, 110);
    if (c.length > 118) c = c.slice(0, 115) + '…';
    return c;
  };

  const brain = think(q, sorted, terms, prior);
  const claims = brain.claims;
  const found = claims.length > 0 || rich.length > 0;

  let short = '';
  if (claims.length) short = shapeByIntent(brain.intent, claims, q);
  else if (rich.length) short = shortOf(rich[0]);
  else short = 'ما لقيتهاش: ما لقيتش مصادر واضحة على «' + q + '».';
  if (short.length > 210) short = short.slice(0, 205) + '…';

  const points = [];
  claims.slice(0, 5).forEach(c => {
    const tag = c.support >= 2 ? c.src + ' · ' + c.support + ' مصادر' : c.src;
    points.push({ src: tag, text: c.text });
  });
  if (points.length < 2) {
    rich.slice(0, 3).forEach(s => {
      const c = s.sum || clause(s.text, 140);
      if (c && c.length > 30 && !points.some(p => p.text.slice(0, 35) === c.slice(0, 35))) points.push({ src: s.name, text: c });
    });
  }

  let example = '';
  const ex = rich.find(s => /(مثال|على سبيل المثال|ex\.|e\.g\.)/i.test(s.text || '')) || rich.find(s => /\d/.test(s.text || ''));
  if (ex) example = clause(ex.text, 130);
  else if (points.length) example = points[0].text.slice(0, 120);
  if (!found) example = 'جرب صياغة بحال: «' + q + ' بالتفصيل» ولا بالإنجليزية، وأنا كنعاود البحث فكل المصادر.';
  if (!example) example = 'ما لقيتش مثال فالمصادر، ولكن نقدر نشرح ليك بمثال من الحياة اليومية إلا بغيتي.';
  const next = found
    ? 'قول ليا «زيد عمّق» ونقرا ليك الصفحات كاملة، ولا سولني على جزئية صغيرة فهاد الموضوع.'
    : 'عطيني كلمة وحدة مفتاحية من الموضوع، ونعاود البحث بيه فكل المصادر.';

  let fresh = [];
  if (prior) {
    const old = new Set(prior.urls || []);
    fresh = sorted.filter(s => s.url && !old.has(s.url)).slice(0, 6);
  }
  const sure = !found ? false : (brain.confidence >= 45 || matchScore(rich[0] || { text: '' }, terms) >= 2);
  const trustCount = sorted.filter(s => trustScore(s) > 0).length;
  const conf = !found ? 0 : Math.max(brain.confidence, Math.min(99, 30 + Math.min(30, trustCount * 2)));
  return { short, points, example, next, found, sure, conf, trustCount, sorted, fresh, brain, verse: getVerse(q) };
}

async function turboRead(list, limit = 40, conc = 8) {
  const targets = list.filter(s => s.url && (!s.text || s.text.length < 40)).slice(0, limit);
  if (!targets.length) return null;
  const el = document.createElement('div');
  el.className = 'msg in';
  el.innerHTML = '<span class="tx">⚡ كنقرا ' + targets.length + ' صفحة بالتوازي...</span>';
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  const t0 = performance.now();
  let i = 0, ok = 0;
  const set = txt => { const s = el.querySelector('.tx'); if (s) s.textContent = txt; };
  async function worker() {
    while (i < targets.length) {
      const s = targets[i++];
      try {
        let md = await jtxt('https://r.jina.ai/' + s.url, 12000).catch(() => '');
        if (!md) md = await readViaProxy(s.url, 15000);
        const lines = md.split('\n').map(x => x.trim()).filter(x => x.length > 90 && !/^(URL Source|Published Time|Markdown Content|Title):/i.test(x));
        if (lines.length) {
          s.text = lines.slice(0, 2).join(' ').slice(0, 400);
          s.sum = firstSentence(s.text) || s.sum || '';
          ok++;
        }
      } catch (e) {}
      set('⚡ قرا ' + ok + '/' + targets.length);
    }
  }
  await Promise.all(Array.from({ length: conc }, worker));
  const sec = (performance.now() - t0) / 1000;
  set('⚡ ' + ok + ' صفحة فـ ' + sec.toFixed(1) + ' ثانية (' + Math.round(ok / Math.max(sec, 0.5)) + ' فالثانية)');
  return { ok: ok, sec: sec, rate: Math.round(ok / Math.max(sec, 0.5)) };
}

async function readFast(texts) {
  const t0 = performance.now();
  const total = texts.length;
  let i = 0;
  const out = new Array(total);
  async function worker() {
    while (i < total) {
      const k = i++;
      const t = String(texts[k] || '');
      out[k] = { text: t, sum: firstSentence(t) };
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  const sec = (performance.now() - t0) / 1000;
  return { items: out, total: total, sec: sec, rate: Math.round(total / Math.max(sec, 0.01)) };
}

function fileOf(lang) {
  return lang === 'python' ? 'azzouz-code.py' : lang === 'javascript' ? 'azzouz-code.js' : lang === 'php' ? 'azzouz-code.php'
    : lang === 'html' ? 'azzouz-code.html' : lang === 'sql' ? 'azzouz-code.sql' : 'azzouz-code.sh';
}
async function writeCode(q) {
  const lang = langOf(q);
  const txt = await llm([
    { role: 'system', content: 'أنت مبرمج خبير. رجع غير الكود بلا شرح وبلا مقدمات، داخل بلوك ```' + lang + '. الكود خاصو يخدم مباشرة، وعطي مثال تشغيل فالأخير داخل تعليق.' },
    { role: 'user', content: q }
  ], 90000);
  const m = String(txt).match(/\`\`\`[a-zA-Z]*\n([\s\S]*?)\`\`\`/);
  const code = m ? m[1].trim() : String(txt || '').trim();
  if (!code) return '';
  return { name: fileOf(lang), code, lang };
}

async function pcWait(id, tries = 12) {
  for (let i = 0; i < tries; i++) {
    await new Promise(r => setTimeout(r, 2500));
    const r = await pcCall({ op: 'job', id });
    if (r && r.ok && (r.status === 'done' || r.status === 'error')) return r;
  }
  return { ok: false, status: 'timeout', result: '' };
}

async function pcAsk(text) {
  if (wantsCode(text)) {
    const t0 = typing();
    const made = await writeCode(text);
    t0.done();
    if (!made) return { ok: false, msg: 'ما قدرتش نكتب الكود دابا، عاود جرب.' };
    const r0 = await pcCall({ op: 'push', kind: 'write', instruction: JSON.stringify({ op: 'write', path: made.name, content: made.code, run: true }) });
    if (!r0 || !r0.ok) return { ok: false, msg: (r0 && r0.error) || 'فشل الإرسال' };
    return { ok: true, id: r0.job_id, code: made.code, name: made.name };
  }
  let kind = 'write';
  if (/^\/run/i.test(text.trim())) kind = 'run';
  else if (/قائمة الملفات|وريني الملفات/.test(text)) kind = 'list';
  else if (/^(اكتب فالنافذة|اكتب في التطبيق)/.test(text.trim())) kind = 'type';
  else if (/^(حل الرابط|حل الموقع)/.test(text.trim())) kind = 'open';
  else if (/(تصويرة|سكرين|screenshot)/i.test(text)) kind = 'shot';
  else if (/^(قلب|بحث|قلب لي|بحث لي)|^\/search/i.test(text.trim())) kind = 'search';
  else if (/^(قرا|قراية|قرا لي)|^\/read/i.test(text.trim())) kind = 'fetch';
  const r = await pcCall({ op: 'push', kind, instruction: pcInstruction(text) });
  if (!r.ok) return { ok: false, msg: r.error || 'فشل الإرسال' };
  return { ok: true, id: r.job_id };
}

async function pcState() {
  const r = await pcCall({ op: 'state' });
  return { online: !!(r && r.online), machine: (r && r.machine) || '', last: (r && r.last_seen) || '' };
}

async function pcLog() {
  const r = await pcCall({ op: 'log' });
  return (r && r.jobs) || [];
}

/* ===== عقل لغوي مجاني بلا مفاتيح ===== */
async function llm(messages, ms = 60000) {
  const body = JSON.stringify({ model: 'openai', messages, referrer: 'azzouz-ai' });
  for (let a = 0; a < 3; a++) {
    try {
      const r = await fetch('https://text.pollinations.ai/openai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body,
        signal: AbortSignal.timeout(ms)
      });
      if (r.status === 402) {
        const wait = a === 0 ? 20000 : 35000;
        if (a < 2) await new Promise(s => setTimeout(s, wait));
        continue;
      }
      if (!r.ok) { await new Promise(s => setTimeout(s, 4000)); continue; }
      const j = await r.json();
      const txt = j && j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content : '';
      if (txt && String(txt).trim().length > 2) return String(txt).trim();
    } catch (e) { await new Promise(s => setTimeout(s, 3000)); }
  }
  return '';
}

const LLM_FALLBACK = 'https://text.pollinations.ai/';

function llmCacheGet(q) {
  try {
    const all = JSON.parse(localStorage.getItem('azzouz-llm-v1') || '{}');
    const row = all[topicOf(q)];
    if (!row) return null;
    if (Date.now() - row.at > 5 * 86400000) return null;
    return row.text || null;
  } catch (e) { return null; }
}

function llmCacheSet(q, text) {
  try {
    const all = JSON.parse(localStorage.getItem('azzouz-llm-v1') || '{}');
    all[topicOf(q)] = { text: String(text || '').slice(0, 4000), at: Date.now() };
    localStorage.setItem('azzouz-llm-v1', JSON.stringify(all));
  } catch (e) {}
}

function parseSections(txt) {
  const t = String(txt || '').replace(/\*\*/g, '');
  const pick = re => { const m = t.match(re); return m ? m[1].trim() : ''; };
  const short = pick(/(?:الخلاصة|خلاصة)\s*[:：]\s*([^\n]+)/i);
  let body = pick(/(?:الشرح)\s*[:：]?\s*\n?([\s\S]*?)(?:\n\s*(?:مثال|شنو ندير دابا)\s*[:：])/i);
  const example = pick(/(?:مثال)\s*[:：]\s*([\s\S]*?)(?:\n\s*شنو ندير دابا|$)/i);
  const next = pick(/(?:شنو ندير دابا|الخطوة الجاية)\s*[:：]\s*([^\n]+)/i);
  const points = String(body || '').split('\n').map(l => l.replace(/^\s*(?:[-*•]|\d+[).\-])\s*/, '').trim()).filter(l => l.length > 12).slice(0, 5);
  if (!short && !points.length) return null;
  return { short, points, example, next };
}

function attachRefs(list) {
  if (!Array.isArray(list) || !list.length) return;
  const btn = document.createElement('span');
  btn.className = 'exp';
  btn.textContent = '📚 المراجع (' + list.length + ')';
  const box = document.createElement('div');
  box.className = 'refs';
  box.innerHTML = list.slice(0, 120).map((s, i) =>
    '<div class="r"><b>' + (i + 1) + '.</b> ' + esc(String(s.name || '').replace(/^\S+\s/, '')) + ' — ' + esc(String(s.title || '').slice(0, 110)) +
    (s.year ? ' (' + s.year + ')' : '') +
    (s.sum ? '<div class="rs">' + esc(String(s.sum).slice(0, 180)) + '</div>' : '') +
    (s.url ? '<a class="lnk" href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(String(s.url).slice(0, 70)) + '</a>' : '') + '</div>').join('');
  btn.onclick = () => { box.classList.toggle('on'); btn.textContent = box.classList.contains('on') ? '🙈 خبي المراجع' : '📚 المراجع (' + list.length + ')'; };
  log.appendChild(btn);
  log.appendChild(box);
  log.scrollTop = log.scrollHeight;
}

async function smartAnswer(q, data, prior) {
  const ctx = (function () {
    try { return JSON.parse(localStorage.getItem('azzouz-conv') || '[]').slice(-4); } catch (e) { return []; }
  })();
  const ctxText = ctx.map(c => 'س: ' + c.q + '\nج: ' + String(c.short || '').slice(0, 180)).join('\n');
  const ev = data.sorted.filter(s => (s.text || s.sum || '').length > 60).slice(0, 6)
    .map((s, i) => '[' + (i + 1) + '] ' + String(s.title || '').slice(0, 90) + ' — ' + String(s.sum || s.text || '').slice(0, 500)).join('\n');
  if (!ev) return false;
  const sys = 'أنت AZZOUZ AI PRO، مساعد مغربي ذكي. جاوب ديما بالدارجة المغربية البسيطة، ماشي بالفصحى. ' +
    'الأساس هو الأدلة اللي كتوصلك: ما تخترعش أرقام ولا أسماء ما كايناش فيها. إلا كان نقص، قول "ما لقيتش" وعطي أقرب حاجة. ' +
    'الشكل إلزامي: سطر "الخلاصة: …" جملة وحدة؛ من بعد "الشرح:" بنقط مرقمة 1. 2. 3. (3 حتى 5 نقط قصيرة)؛ ' +
    'من بعد "مثال: …" مثال قصير من الحياة المغربية؛ وصلالآخر "شنو ندير دابا: …" اقتراح واحد. بلا مقدمات وبلا خاتمة زايدة.';
  let out = llmCacheGet(q) || '';
  if (!out) out = await llm([
    { role: 'system', content: sys },
    { role: 'user', content: (ctxText ? 'السياق ديال المحادثة:\n' + ctxText + '\n\n' : '') + 'السؤال: ' + q + '\n\nالأدلة من المصادر:\n' + ev + (prior ? '\n\nملاحظة: جواب سابق كان: ' + String(prior.idea || '').slice(0, 200) : '') }
  ]);
  if (out) llmCacheSet(q, out);
  const sec = out ? parseSections(out) : null;
  if (!sec) return false;
  let h = '';
  const fx = findFix(topicOf(q));
  if (fx) h += '<div class="h">✍️ تصحيح محفوظ</div>' + esc(String(fx.note).slice(0, 240)) + '<br><br>';
  h += '<div class="h">1. الخلاصة</div><b>' + esc(sec.short || data.short) + '</b><br><br>';
  if (sec.points.length) {
    h += '<div class="h">2. الشرح</div>';
    sec.points.forEach((p, i) => { h += (i + 1) + '. ' + esc(p) + '<br>'; });
    h += '<br>';
  }
  h += '<div class="h">3. مثال</div>' + esc(sec.example || data.example) + '<br>';
  h += '<div class="h">4. شنو ندير دابا</div>' + esc(sec.next || data.next || '') + '<br>';
  h = h.replace(/\[(\d{1,2})\]/g, (m, n) => {
    const s = data.sorted[Number(n) - 1];
    return s && s.url ? '<a class="srctag" href="' + esc(s.url) + '" target="_blank" rel="noopener">[' + n + ']</a>' : m;
  });
  h += '<br><b>واش بغيتي نكمل؟</b>';
  const card = addMsg(h, 'in');
  addActions(card, q);
  attachRefs(data.sorted);
  try {
    const arr = JSON.parse(localStorage.getItem('azzouz-conv') || '[]');
    arr.push({ q, short: sec.short || data.short });
    localStorage.setItem('azzouz-conv', JSON.stringify(arr.slice(-6)));
  } catch (e) {}
  return true;
}

let rec = null, V = { on: false, base: '', cur: '', timer: null };
function dedupe(t) {
  let s = String(t || '').replace(/\s+/g, ' ').trim();
  for (let n = 8; n >= 2; n--) {
    const re = new RegExp('(\\S+(?: \\S+){' + (n - 1) + '})(?: \\1)+', 'g');
    s = s.replace(re, '$1');
  }
  return s.replace(/\s+/g, ' ').trim();
}
function vStop() {
  if (!V.on) return;
  V.on = false;
  clearTimeout(V.timer);
  $('vbar').classList.remove('on');
  $('mic').classList.add('rec');
  try { rec && rec.stop(); } catch (e) {}
  const said = dedupe(V.cur || '');
  setTimeout(() => {
    if (said.length > 2) ask(said);
    else addMsg('ما سمعت والو. عاود اضغط 🎙️ وقول سؤالك.', 'in');
  }, 120);
}
function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { addMsg('المتصفح ما كيدعمش الصوت. استعمل Chrome.', 'in'); return; }
  rec = new SR();
  rec.lang = 'ar';
  rec.continuous = true;
  rec.interimResults = true;
  V = { on: true, base: '', cur: '', timer: null };

  rec.onstart = () => {
    $('vbar').classList.add('on');
    $('vtxt').textContent = 'كنسمع... اهضر عادي';
    $('mic').classList.remove('rec');
  };
  rec.onresult = e => {
    let cur = '';
    for (let i = 0; i < e.results.length; i++) cur += e.results[i][0].transcript + ' ';
    const full = dedupe(((V.base ? V.base + ' ' : '') + cur).trim());
    V.cur = full;
    $('vtxt').textContent = full || 'كنسمع...';
    clearTimeout(V.timer);
    V.timer = setTimeout(vStop, 2400);
  };
  rec.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    $('vtxt').textContent = 'خطأ فالصوت: ' + e.error;
  };
  rec.onend = () => {
    if (V.on) { V.base = V.cur; try { rec.start(); } catch (e) {} }
    else { $('vbar').classList.remove('on'); $('mic').classList.remove('rec'); }
  };
  try { rec.start(); } catch (e) { addMsg('ما قدرتش نشعل الميكرو.', 'in'); }
}

function keywordsOf(sources) {
  const stop = new Set(['the', 'and', 'for', 'with', 'from', 'that', 'this', 'على', 'في', 'من', 'إلى', 'عن', 'التي', 'الذي', 'هذا', 'هذه', 'كان', 'كما', 'بين', 'أو', 'ثم', 'كل', 'بعد', 'قبل', 'غير', 'حتى', 'هو', 'هي']);
  const cnt = {};
  sources.forEach(s => {
    const words = clean((s.title || '') + ' ' + (s.text || '')).split(/[^\p{L}\p{N}]+/u);
    words.forEach(w => {
      const t = w.toLowerCase();
      if (t.length < 4 || stop.has(t) || /^\d+$/.test(t)) return;
      cnt[t] = (cnt[t] || 0) + 1;
    });
  });
  return Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 14).map(x => x[0]);
}

function hUI() {

  if (hb) hb.style.width = Math.min(100, (H.total / H.target) * 100) + '%';
}
function hStart(q, en) {
  if (H.on && H.q === q) return;
  H.q = q; H.on = true; H.total = 0; H.refs = []; H.cur = {}; H.busy = false;
  hUI();
  clearInterval(H.timer);
  H.timer = setInterval(hTick, 1500);
  hTick();
}
async function hTick() {
  if (H.busy || !H.on) return;
  if (H.total >= H.target || H.refs.length >= H.target) { H.on = false; clearInterval(H.timer); hUI(); return; }
  H.busy = true;
  const eng = HARV[(H.cursor = (H.cursor || 0) + 1) % HARV.length];
  const en = en2(H.q);
  try {
    const out = await eng.step(H.q, en, H.cur[eng.name] = H.cur[eng.name] || {});
    (out.items || []).forEach(it => {
      if (!it.title) return;
      H.refs.push({ ...it, name: it.name || eng.name });
      H.total++;
    });
    if (out.done) { H.cur[eng.name].done = true; }
  } catch (e) {}
  H.busy = false;
  hUI();
  statusEl.textContent = 'كنقرا: ' + H.total.toLocaleString('ar-MA') + ' مصدر';
}

async function readPDF(f) {
  const pdfjs = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs';
  const doc = await pdfjs.getDocument({ data: await f.arrayBuffer() }).promise;
  let out = '';
  const pages = Math.min(doc.numPages, 25);
  for (let p = 1; p <= pages; p++) {
    const pg = await doc.getPage(p);
    const c = await pg.getTextContent();
    out += c.items.map(i => i.str).join(' ') + '\n';
  }
  return out;
}

async function describeImage(f) {
  const key = visionKey();
  if (!key) return '';
  const b64 = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(new Error('read fail'));
    r.readAsDataURL(f);
  });
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + key, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts: [
      { text: 'وصف هاد الصورة بالدارجة المغربية: شنو فيها بالضبط، واش فيها بنادم، شنو لابس، فين كاين، وشنو كيدير. بلا حشو.' },
      { inline_data: { mime_type: f.type || 'image/jpeg', data: b64 } }
    ] }] })
  });
  const d = await r.json();
  return (d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts[0].text) || '';
}

const GH = { cache: null };
async function loadGH() {
  try {
    const r = await fetch('data/memory.json?t=' + Date.now());
    const d = await r.json();
    GH.cache = (d && d.entries) || [];
  } catch (e) { GH.cache = []; }
  return GH.cache;
}
function cacheHit(q) {
  if (!GH.cache || !GH.cache.length) return null;
  const n = s => String(s || '').replace(/[؟?]/g, '').trim().toLowerCase();
  const t = topicOf(q);
  return GH.cache.find(e => {
    const et = topicOf(e.topic || '');
    const a = n(e.topic || ''), b = n(q);
    return et === t || (b.includes(a) && a.length > 3) || (a.includes(b) && b.length > 3);
  }) || null;
}

/* ===== قراية سريعة ف Web Worker ===== */
const WORKER_SRC = `
self.onmessage = async (e) => {
  const urls = (e.data && e.data.urls) || [];
  const out = [];
  for (const u of urls) {
    try {
      const r = await fetch('https://r.jina.ai/' + u);
      const t = await r.text();
      const lines = t.split('\\n').map(l => l.trim()).filter(l =>
        l.length > 90 && !/^(URL Source|Published Time|Title:|Markdown Content|Warning:)/i.test(l));
      out.push({ url: u, text: lines.slice(0, 2).join(' ').slice(0, 500) });
    } catch (err) {
      out.push({ url: u, text: '' });
    }
  }
  self.postMessage({ result: out });
};`;
function makeReader() {
  const b = new Blob([WORKER_SRC], { type: 'text/javascript' });
  return new Worker(URL.createObjectURL(b));
}
turboRead = async function (list, limit = 36) {
  const targets = list.filter(s => s.url && (!s.text || s.text.length < 40)).slice(0, limit);
  if (!targets.length) return;
  const note = addMsg('⚡ كنقرا ' + targets.length + ' صفحة بالتوازي...', 'in');
  const t0 = performance.now();
  let ok = 0;
  try {
    const groups = [];
    for (let i = 0; i < targets.length; i += 6) groups.push(targets.slice(i, i + 6));
    const jobs = groups.map(g => new Promise(res => {
      let w;
      try { w = makeReader(); } catch (e) { return res([]); }
      const timer = setTimeout(() => { try { w.terminate(); } catch (e) {} res([]); }, 25000);
      w.onmessage = ev => {
        if (!ev.data || !ev.data.result) return;
        clearTimeout(timer);
        try { w.terminate(); } catch (e) {}
        res(ev.data.result);
      };
      w.postMessage({ urls: g.map(s => s.url) });
    }));
    const all = (await Promise.all(jobs)).flat();
    const byUrl = new Map(all.map(r => [r.url, r]));
    targets.forEach(s => {
      const r = byUrl.get(s.url);
      if (r && r.text) { s.text = r.text; s.sum = firstSentence(s.text); ok++; }
    });
  } catch (e) {}
  const sec = (performance.now() - t0) / 1000;
  note.innerHTML = '<div class="h">⚡ قراية سريعة</div>' + ok + ' صفحة فـ ' + sec.toFixed(1) +
    ' ثانية · ' + Math.round(ok / Math.max(sec, 0.2)) + ' فالثانية<div class="meta">' + now() + '</div>';
};
