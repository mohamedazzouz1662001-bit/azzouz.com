<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202c33">
<title>Azzouz — مساعد ذكي</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b141a;--panel:#202c33;--panel2:#111b21;--line:#2a3942;--out:#005c4b;--in:#202c33;--txt:#e9edef;--dim:#8696a0;--acc:#00a884;--tick:#53bdeb}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',Roboto,Tahoma,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(140deg,#00a884,#0b6b57);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#04241c}
.hd{flex:1;min-width:0}
.hd b{font-size:15.5px;display:block}
.hd span{font-size:11px;color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:34px;height:34px;border-radius:50%;background:#2a3942;border:none;color:var(--txt);font-size:15px;cursor:pointer;flex-shrink:0}
#log{flex:1;overflow-y:auto;padding:12px 10px 8px;display:flex;flex-direction:column;gap:7px}
.msg{max-width:86%;padding:8px 11px;border-radius:9px;font-size:14px;line-height:1.75;position:relative;word-wrap:break-word;white-space:pre-wrap}
.in{background:var(--in);align-self:flex-start;border-top-right-radius:2px}
.out{background:var(--out);align-self:flex-end;border-top-left-radius:2px}
.meta{font-size:10px;color:#7d8f99;text-align:left;margin-top:3px}
.out .meta{color:#a7c7bd}
.h{font-weight:700;color:#9be0c6;margin-bottom:3px;font-size:13px}
.lnk{color:#7fd9ff;text-decoration:none;word-break:break-all;font-size:12px;display:block;margin-top:2px}
.exp{display:inline-block;margin-top:7px;font-size:12px;color:#9be0c6;background:#1b2b28;border:1px solid #2c4a44;border-radius:8px;padding:6px 10px;cursor:pointer}
.refs{display:none;margin-top:7px;border-top:1px solid #2f4048;padding-top:6px;max-height:250px;overflow-y:auto}
.refs.on{display:block}
.r{font-size:12px;color:#cfd9dd;padding:4px 0;border-bottom:1px dashed #25343b}
.r b{color:#9be0c6;font-weight:600}
.sugg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sugg button{background:#1b2b28;border:1px solid #2c4a44;color:#9be0c6;font-size:11.5px;padding:5px 9px;border-radius:14px;cursor:pointer;font-family:inherit}
.chain{background:var(--in);align-self:flex-start;border-radius:9px;padding:8px 11px;font-size:12px;color:#9fb2ba}
.chain .st{display:flex;gap:7px;align-items:center;margin:3px 0}
.chain .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
footer{background:var(--panel);padding:8px 9px;display:flex;gap:7px;align-items:flex-end;border-top:1px solid var(--line);flex-shrink:0}
#q{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:11px 14px;font-size:14px;font-family:inherit;resize:none;max-height:110px;min-height:44px;outline:none}
.fbtn{width:44px;height:44px;border-radius:50%;border:none;background:var(--panel2);color:var(--txt);font-size:17px;cursor:pointer;flex-shrink:0}
.fbtn.send{background:var(--acc);color:#04241c}
.fbtn.rec{background:#c62828;color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(198,40,40,.15)}}
.vbar{display:none;align-items:center;gap:8px;background:#182229;border-top:1px solid var(--line);padding:8px 12px;font-size:12.5px;color:#cfe6de}
.vbar.on{display:flex}
.vbar .txt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{position:fixed;inset:auto 0 0 0;height:80vh;background:var(--bg);border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(102%);transition:.25s;z-index:60;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sh{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.sh b{flex:1;font-size:14.5px}
.stabs{display:flex;gap:6px;padding:9px 12px;background:var(--panel2)}
.stabs button{flex:1;background:#1b272e;border:1px solid var(--line);color:#a8bcc7;font-size:12.5px;padding:7px;border-radius:10px;font-family:inherit;cursor:pointer}
.stabs button.on{background:var(--acc);color:#04241c;border-color:var(--acc);font-weight:700}
.sbody{flex:1;overflow-y:auto;padding:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:10px;font-size:13px;line-height:1.7}
.card h4{font-size:13px;color:#9be0c6;margin-bottom:6px}
.chip{display:inline-block;background:#1b2b28;border:1px solid #2c4a44;color:#9be0c6;font-size:11.5px;padding:3px 9px;border-radius:12px;margin:2px;cursor:pointer}
.brow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.brow button{background:#1b2b28;border:1px solid #2c4a44;color:#cfe6de;font-size:12px;padding:6px 10px;border-radius:9px;font-family:inherit;cursor:pointer}
.mrow{display:flex;gap:8px;align-items:center;border-bottom:1px solid #1d2a31;padding:7px 0;font-size:12.5px}
.mrow span{flex:1;color:#cfd9dd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow button{background:#22303a;border:none;color:#ff8a80;border-radius:7px;padding:4px 8px;font-size:11px;cursor:pointer}
.num{font-size:11px;color:var(--dim)}
.bars{display:flex;gap:3px;align-items:flex-end;height:44px;margin-top:6px}
.bars i{flex:1;background:#2c4a44;border-radius:2px 2px 0 0;min-height:2px}
</style>
</head>
<body>
<header>
  <div class="avatar">A</div>
  <div class="hd"><b>Azzouz</b><span id="status">متصل · كنقرا من كل الويب</span></div>
  <button class="icon" id="tools" title="الأدوات">☰</button>
  <button class="icon" id="mic" title="فويس">🎙️</button>
</header>
<main id="log"></main>
<div class="vbar" id="vbar"><span>🎙️</span><span class="txt" id="vtxt">كنسمع...</span><button class="icon" id="vstop">سالِي</button></div>
<footer>
  <button class="fbtn" id="mic2">🎙️</button>
  <textarea id="q" rows="1" placeholder="كتب سؤالك..."></textarea>
  <button class="fbtn send" id="send">➤</button>
</footer>
<div class="sheet" id="sheet">
  <div class="sh"><b>الأدوات</b><button class="icon" id="shclose">✕</button></div>
  <div class="stabs"><button data-p="report" class="on">آخر جواب</button><button data-p="memory">الذاكرة</button></div>
  <div class="sbody" id="paneReport"></div>
  <div class="sbody" id="paneMemory" hidden></div>
</div>
<script>
/* ===== أدوات ===== */
const $ = id => document.getElementById(id);
const log = $('log'), qEl = $('q'), statusEl = $('status');
const enc = encodeURIComponent;
let busy = false, LAST = null;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function clean(h) { return String(h || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }
function now() { const d = new Date(); return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0'); }
function tick() { return '✓✓'; }

async function jget(url, ms = 9000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error('x'); return await r.json(); }
  finally { clearTimeout(t); }
}
async function jtxt(url, ms = 15000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error('x'); return await r.text(); }
  finally { clearTimeout(t); }
}
function invAbs(idx) {
  if (!idx) return '';
  const arr = [];
  Object.keys(idx).forEach(w => idx[w].forEach(p => { arr[p] = w; }));
  return arr.filter(Boolean).join(' ');
}

/* ===== الذاكرة ===== */
let DB = null, memory = [];
const DB_NAME = 'azzouz-brain-v3';
function initDB() {
  try {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('memories')) db.createObjectStore('memories', { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = e => { DB = e.target.result; loadMem(); };
    req.onerror = () => loadMem();
  } catch (e) { loadMem(); }
}
function loadMem() {
  try { memory = JSON.parse(localStorage.getItem('azzouz-mem-v3') || '[]'); } catch (e) { memory = []; }
  refreshMemCount();
  if (DB) {
    try {
      const rq = DB.transaction('memories', 'readonly').objectStore('memories').getAll();
      rq.onsuccess = () => { if (rq.result && rq.result.length) { memory = rq.result; refreshMemCount(); } };
    } catch (e) {}
  }
}
function refreshMemCount() { $('status').dataset.mem = memory.length; }
function persistMem() {
  try { localStorage.setItem('azzouz-mem-v3', JSON.stringify(memory.slice(-120))); } catch (e) {}
  if (DB) { try { DB.transaction('memories', 'readwrite').objectStore('memories').put(memory[memory.length - 1]); } catch (e) {} }
}
function topicOf(q) {
  const t = String(q || '').toLowerCase().replace(/[؟?.,،!]/g, ' ').replace(/\s+/g, ' ').trim();
  const w = t.split(' ').filter(x => x.length > 2 && !['ما', 'هو', 'هي', 'شنو', 'كيفاش', 'كيف', 'على', 'عن', 'في', 'من', 'the', 'what', 'how'].includes(x));
  return w.slice(0, 3).join(' ') || t.slice(0, 20);
}
function findPrior(q) {
  const t = topicOf(q), ws = t.split(' ');
  let best = null, score = 0;
  memory.forEach(m => {
    let s = 0;
    if (m.topic === t) s = 1;
    else {
      const mw = String(m.topic || '').split(' ');
      const hit = mw.filter(x => ws.includes(x)).length;
      s = mw.length ? hit / Math.max(mw.length, ws.length) : 0;
    }
    if (s > score) { score = s; best = m; }
  });
  return score >= 0.6 ? best : null;
}

/* ===== قراءة الويب: محركات ===== */
function extractKeyword(q) {
  const map = { 'ثقب': 'السماء', 'نحل': 'النحل', 'نمل': 'النمل', 'نور': 'النور', 'سماء': 'السماء', 'حديد': 'الحديد', 'علم': 'العلم', 'قلب': 'القلب', 'قرآن': 'القرآن', 'طاقة': 'الطاقة', 'ماء': 'الماء', 'أرض': 'الأرض', 'رحمة': 'الرحمة' };
  for (const k in map) if (q.includes(k)) return map[k];
  const w = q.split(/\s+/).filter(x => x.length > 2 && /[\u0600-\u06FF]/.test(x));
  return w[0] || null;
}
function englishOf(q) {
  const g = { 'النحل': 'honey bee', 'الصيام المتقطع': 'intermittent fasting', 'الزليج': 'zellige', 'التشفير': 'encryption', 'الذكاء الاصطناعي': 'artificial intelligence', 'ضغط البيانات': 'data compression', 'الثقب الأسود': 'black hole', 'الطاقة': 'energy', 'الماء': 'water' };
  for (const k in g) if (q.includes(k)) return g[k];
  return q;
}
function realU(u) {
  try { const m = /uddg=([^&]+)/.exec(u); if (m) return decodeURIComponent(m[1]); } catch (e) {}
  return u;
}
function parseLinks(md, engine) {
  const out = [], re = /\[([^\]\n]{10,150})\]\((https?:\/\/[^)\s]+)\)/g;
  let m;
  while ((m = re.exec(md))) {
    const title = clean(m[1]), url = realU(m[2]);
    if (/jina\.ai|bing\.com\/ck|duckduckgo\.com\/l|google\.com\/search|startpage\.com|qwant\.com|ecosia\.org/.test(url)) continue;
    if (title.length < 12) continue;
    out.push({ name: '🌐 ' + engine, title: title.slice(0, 140), text: '', url, weight: 6 });
  }
  return out;
}

async function gather(q, tickFn) {
  const S = [], en = englishOf(q), seen = new Set();
  const push = o => {
    if (!o || !o.title) return;
    const k = String(o.url || o.title).split('#')[0];
    if (seen.has(k)) return;
    seen.add(k);
    S.push(o);
    if (tickFn) tickFn(S.length);
  };

  const tasks = [
    async () => { const kw = extractKeyword(q); if (!kw) return; const d = await jget('https://api.alquran.cloud/v1/search/' + enc(kw) + '/all/quran-uthmani');
      (d.data && d.data.matches || []).slice(0, 2).forEach(a => push({ name: '📖 القرآن', title: a.surah.englishName + ' — آية ' + a.numberInSurah, text: a.text, url: 'https://quran.com/' + a.surah.number + '/' + a.numberInSurah, weight: 10 })); },
    async () => { const d = await jget('https://ar.wikipedia.org/w/api.php?action=query&list=search&srsearch=' + enc(q) + '&format=json&origin=*');
      (d.query && d.query.search || []).slice(0, 6).forEach(r => push({ name: '📚 ويكيبيديا العربية', title: r.title, text: clean(r.snippet), url: 'https://ar.wikipedia.org/wiki/' + enc(r.title.replace(/ /g, '_')), weight: 9 })); },
    async () => { const d = await jget('https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=' + enc(en) + '&format=json&origin=*');
      (d.query && d.query.search || []).slice(0, 6).forEach(r => push({ name: '📚 Wikipedia', title: r.title, text: clean(r.snippet), url: 'https://en.wikipedia.org/wiki/' + enc(r.title.replace(/ /g, '_')), weight: 8 })); },
    async () => { const d = await jget('https://api.openalex.org/works?search=' + enc(q) + '&per_page=50&sort=relevance_score:desc');
      (d.results || []).forEach(w => push({ name: '🔬 OpenAlex', title: w.display_name, text: invAbs(w.abstract_inverted_index).slice(0, 400), url: w.doi ? 'https://doi.org/' + String(w.doi).replace('https://doi.org/', '') : w.id, year: w.publication_year, weight: 8 })); },
    async () => { const d = await jget('https://api.crossref.org/works?query=' + enc(en) + '&rows=50&select=title,URL,issued,abstract');
      ((d.message && d.message.items) || []).forEach(w => push({ name: '🎓 Crossref', title: (w.title || [])[0], text: clean(w.abstract).slice(0, 350), url: w.URL, year: (w.issued && w.issued['date-parts'] || [[]])[0][0], weight: 7 })); },
    async () => { const d = await jget('https://api.semanticscholar.org/graph/v1/paper/search?query=' + enc(en) + '&limit=20&fields=title,abstract,url,year');
      (d.data || []).forEach(p => push({ name: '📄 Semantic Scholar', title: p.title, text: (p.abstract || '').slice(0, 350), url: p.url, year: p.year, weight: 7 })); },
    async () => { const d = await jget('https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=' + enc(en) + '&format=json&pageSize=25');
      ((d.resultList && d.resultList.result) || []).forEach(r => push({ name: '🧪 Europe PMC', title: r.title, text: clean(r.abstractText).slice(0, 350), url: r.doi ? 'https://doi.org/' + r.doi : 'https://europepmc.org/article/' + r.id, year: r.pubYear, weight: 7 })); },
    async () => { const d = await jget('https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&retmode=json&retmax=20&term=' + enc(en));
      const ids = (d.esearchresult && d.esearchresult.idlist) || [];
      if (!ids.length) return;
      const s = await jget('https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&retmode=json&id=' + ids.join(','));
      Object.values(s.result || {}).forEach(r => { if (r && r.title) push({ name: '🩺 PubMed', title: r.title, text: '', url: 'https://pubmed.ncbi.nlm.nih.gov/' + r.uid + '/', year: (r.pubdate || '').slice(0, 4), weight: 7 }); }); },
    async () => { const d = await jtxt('https://export.arxiv.org/api/query?search_query=all:' + enc(en) + '&max_results=12');
      const blocks = d.split('<entry>').slice(1);
      blocks.forEach(b => {
        const t = (b.match(/<title>([\s\S]*?)<\/title>/) || [])[1] || '';
        const u = (b.match(/<id>([\s\S]*?)<\/id>/) || [])[1] || '';
        const su = (b.match(/<summary>([\s\S]*?)<\/summary>/) || [])[1] || '';
        push({ name: '📐 arXiv', title: clean(t), text: clean(su).slice(0, 300), url: clean(u), weight: 7 });
      }); },
    async () => { const d = await jget('https://openlibrary.org/search.json?q=' + enc(q) + '&limit=12');
      (d.docs || []).forEach(b => push({ name: '📕 Open Library', title: b.title, text: 'كتاب' + (b.author_name ? ' لـ ' + b.author_name.join(', ') : '') + (b.first_publish_year ? ' — ' + b.first_publish_year : ''), url: 'https://openlibrary.org' + (b.key || ''), year: b.first_publish_year, weight: 7 })); },
    async () => { const d = await jget('https://archive.org/advancedsearch.php?q=' + enc(q) + '&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=year&rows=15&page=1&output=json');
      (((d.response || {}).docs) || []).forEach(b => push({ name: '🗄️ أرشيف الإنترنت', title: b.title, text: '', url: 'https://archive.org/details/' + b.identifier, year: b.year, weight: 6 })); },
    async () => { const d = await jget('https://hn.algolia.com/api/v1/search?query=' + enc(en) + '&hitsPerPage=20');
      (d.hits || []).forEach(h => push({ name: '💬 Hacker News', title: h.title || h.story_title, text: clean(h.story_text || h.comment_text).slice(0, 250), url: h.url || 'https://news.ycombinator.com/item?id=' + h.objectID, year: (h.created_at || '').slice(0, 4), weight: 5 })); },
    async () => { const d = await jget('https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=relevance&q=' + enc(en) + '&site=stackoverflow&pagesize=15&filter=default');
      (d.items || []).forEach(i => push({ name: '💻 Stack Overflow', title: clean(i.title), text: '', url: i.link, year: (i.creation_date ? new Date(i.creation_date * 1000).getFullYear() : null), weight: 6 })); },
    async () => { const d = await jget('https://api.github.com/search/repositories?q=' + enc(en) + '&per_page=10&sort=stars');
      (d.items || []).forEach(r => push({ name: '💻 GitHub', title: r.full_name, text: (r.description || '').slice(0, 200), url: r.html_url, weight: 5 })); },
    async () => { const d = await jget('https://www.wikidata.org/w/api.php?action=wbsearchentities&search=' + enc(q) + '&language=ar&limit=8&format=json&origin=*');
      (d.search || []).forEach(e => push({ name: '🧩 Wikidata', title: e.label || e.id, text: clean(e.description), url: 'https://www.wikidata.org/wiki/' + e.id, weight: 5 })); },
    async () => { const d = await jget('https://api.duckduckgo.com/?q=' + enc(en) + '&format=json&no_html=1&skip_disambig=1');
      if (d.AbstractText) push({ name: '🌐 DuckDuckGo', title: d.Heading || en, text: d.AbstractText.slice(0, 350), url: d.AbstractURL || ('https://duckduckgo.com/?q=' + enc(en)), weight: 7 }); },
    async () => { const d = await jget('https://www.googleapis.com/books/v1/volumes?q=' + enc(q) + '&maxResults=15');
      (d.items || []).forEach(b => { const v = b.volumeInfo || {}; push({ name: '📗 Google Books', title: v.title, text: (v.description || '').slice(0, 300), url: v.infoLink, year: (v.publishedDate || '').slice(0, 4), weight: 7 }); }); },
    async () => { const d = await jget('https://zenodo.org/api/records?q=' + enc(en) + '&size=20');
      ((d.hits || {}).hits || []).forEach(r => push({ name: '🗃️ Zenodo', title: ((r.metadata || {}).title || ''), text: clean(((r.metadata || {}).description || '')).slice(0, 300), url: r.doi_url || ('https://zenodo.org/record/' + r.id), year: ((r.metadata || {}).publication_date || '').slice(0, 4), weight: 6 })); },
    async () => { const d = await jget('https://doaj.org/api/search/articles/' + enc(en) + '?pageSize=20');
      (d.results || []).forEach(r => { const b = r.bibjson || {}; push({ name: '📘 DOAJ', title: b.title, text: clean((b.abstract || '')).slice(0, 300), url: (b.link && b.link[0] && b.link[0].url) || '', year: b.year, weight: 6 }); }); }
  ];

  // مسح الويب: محركات كاملة عبر قارئ الصفحات + صيغ الملفات
  const sweeps = [
    ['duckduckgo', 'https://html.duckduckgo.com/html/?q=' + enc(q)],
    ['duckduckgo-en', 'https://html.duckduckgo.com/html/?q=' + enc(en)],
    ['bing', 'https://www.bing.com/search?q=' + enc(en)],
    ['startpage', 'https://www.startpage.com/sp/search?query=' + enc(en)],
    ['brave', 'https://search.brave.com/search?q=' + enc(en)],
    ['ecosia', 'https://www.ecosia.org/search?q=' + enc(en)],
    ['qwant', 'https://www.qwant.com/?q=' + enc(en)],
    ['mojeek', 'https://www.mojeek.com/search?q=' + enc(en)],
    ['pdf', 'https://html.duckduckgo.com/html/?q=' + enc(en + ' filetype:pdf')],
    ['office', 'https://html.duckduckgo.com/html/?q=' + enc(en + ' (filetype:docx OR filetype:pptx OR filetype:xlsx)')],
    ['drive', 'https://html.duckduckgo.com/html/?q=' + enc(en + ' site:drive.google.com')],
    ['deep-web', 'https://html.duckduckgo.com/html/?q=' + enc(q + ' archive OR database OR repository')]
  ];
  sweeps.forEach(([name, url]) => {
    tasks.push(async () => {
      const md = await jtxt('https://r.jina.ai/' + url);
      parseLinks(md, name).slice(0, 25).forEach(push);
    });
  });

  // تنفيذ بتوازي محدود
  let i = 0;
  async function worker() {
    while (i < tasks.length) {
      const idx = i++;
      try { await tasks[idx](); } catch (e) {}
      if (tickFn) tickFn(S.length);
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  await fillSnippets(S, tickFn);
  return S;
}


/* ===== ملخص لكل مرجع ===== */
function firstSentence(t) {
  const s = clean(t);
  if (!s) return '';
  const m = s.match(/^(.{40,190}?[.!؟])\s/);
  return m ? m[1] : s.slice(0, 170);
}

async function fillSnippets(S, tickFn) {
  const need = S.filter(o => !o.text || o.text.length < 40).slice(0, 24);
  let i = 0;
  async function w() {
    while (i < need.length) {
      const o = need[i++];
      if (!o.url || !/^https?:/.test(o.url)) continue;
      try {
        const md = await jtxt('https://r.jina.ai/' + o.url, 12000);
        const txt = md.split('\n').map(l => l.trim())
          .filter(l => l.length > 80 && !/^(URL Source|Title|Markdown Content|Published Time|Description):/i.test(l))
          .slice(0, 2).join(' ');
        if (txt) o.text = txt.slice(0, 340);
      } catch (e) {}
      if (tickFn) tickFn(S.length);
    }
  }
  await Promise.all([w(), w(), w()]);
  S.forEach(o => { o.sum = firstSentence(o.text); });
}

/* ===== التلخيص ===== */
function clause(t, n = 150) {
  let s = clean(t).replace(/\s+/g, ' ');
  const cut = s.search(/[.!؟;]/);
  if (cut > 40) s = s.slice(0, cut + 1);
  return s.slice(0, n).trim();
}
function getVerse(q) {
  const t = q.toLowerCase();
  if (/نحل|bee/.test(t)) return '﴿ وأوحى ربك إلى النحل ﴾ النحل 68';
  if (/نمل|ant/.test(t)) return '﴿ قالت نملة يا أيها النمل ﴾ النمل 18';
  if (/نور|ضوء|light/.test(t)) return '﴿ الله نور السماوات والأرض ﴾ النور 35';
  if (/ماء|water|طاقة|energy/.test(t)) return '﴿ وجعلنا من الماء كل شيء حي ﴾ الأنبياء 30';
  if (/علم|science|بحث/.test(t)) return '﴿ وقل رب زدني علما ﴾ طه 114';
  if (/سماء|كون|space|black/.test(t)) return '﴿ والسماء بنيناها بأيد وإنا لموسعون ﴾ الذاريات 47';
  return '﴿ وفي الأرض آيات للموقنين ﴾ الذاريات 20';
}
function synthesize(q, sources, prior) {
  const sorted = sources.slice().sort((a, b) => (b.weight || 0) - (a.weight || 0));
  const rich = sorted.filter(s => (s.text || '').length > 40);
  const parts = rich.slice(0, 3).map(s => clause(s.text, 150));
  let idea = '';
  if (parts.length) {
    idea = parts[0];
    if (parts[1]) idea += ' وهاد الشي كيتأكد من مصادر أخرى كتقول ' + parts[1];
    if (parts[2]) idea += '، ومن زاوية أخرى ' + parts[2];
  } else if (sorted.length) {
    idea = 'لقيت ' + sorted.length + ' مصدر مرتبط بـ«' + q + '»، أهمها: ' + sorted.slice(0, 3).map(s => s.title).join(' · ');
  } else {
    idea = 'ما لقيتش مصادر كافية على «' + q + '». جرب صياغة أخرى.';
  }
  const points = [];
  const usedTitles = new Set();
  rich.forEach(s => {
    const c = s.sum || clause(s.text, 130);
    if (!c || c.length < 30) return;
    const key = c.slice(0, 40);
    if (usedTitles.has(key)) return;
    usedTitles.add(key);
    if (points.length < 5) points.push({ src: s.name, text: c });
  });
  let fresh = [];
  if (prior) {
    const old = new Set(prior.urls || []);
    fresh = sorted.filter(s => s.url && !old.has(s.url)).slice(0, 6);
  }
  return { idea, points, sorted, fresh, verse: getVerse(q) };
}


/* ===== الطابع البشري ===== */
function nameOf() { try { return localStorage.getItem('azzouz-name') || ''; } catch (e) { return ''; } }
function setName(n) { try { localStorage.setItem('azzouz-name', n); } catch (e) {} }
function hi() {
  const h = new Date().getHours();
  return h < 5 ? 'مبروك عليك الليل' : h < 12 ? 'صباح الخير' : h < 18 ? 'مساء الخير' : 'مسا الخير';
}
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

function smallTalk(q) {
  const t = String(q).trim();
  const nm = nameOf();
  const m = t.match(/(?:سميني|سميتي|نسميني|سمي ليا)\s+([\p{L}]{2,20})/u);
  if (m) { setName(m[1]); return 'متشرفين ' + m[1] + ' 🌿 غادي نتعلم معاك ونتفكرك.'; }
  if (/^(السلام|سلام|صباح الخير|مساء الخير|مسا الخير|أهلا|اهلا|مرحبا|هاي)/i.test(t) && t.length < 40)
    return pick(['وعليكم السلام' + (nm ? ' ' + nm : '') + ' 🌿', 'أهلا' + (nm ? ' ' + nm : '') + ' 🌿 كيفاش داير؟']) + ' سولني أي حاجة ونبحث ليك.';
  if (/(كيف حالك|كيداير|لباس|كيفاش داير)/i.test(t) && t.length < 30)
    return 'الحمد لله، خدام كنقرا ونبحث. ونتا كيف داير؟' + (nm ? '' : ' وسميني باش نتعرف عليك.');
  if (/^(شكرا|بارك الله|الله يخليك|تسلم)/i.test(t)) return pick(['على الرحب والسعة 🌿', 'الله يبارك فيك 🌿 أي وقت.']);
  if (/(شكون نتا|من نتا|سميتك)/i.test(t)) return 'أنا Azzouz 🌿 كنقرا من محركات الويب والأبحاث والكتب، وكنعطيك فكرة وحدة بالمراجع.' + (nm ? ' ونتا ' + nm + '.' : '');
  if (/(بسلامة|نشوفك من بعد|تصبح على خير)/i.test(t)) return 'بسلامة الله 🌿 أنا هنا إلا بغيتي شي حاجة.';
  return null;
}

/* ===== السؤال ===== */
async function ask(text) {
  const q = String(text || '').trim();
  if (!q || busy) return;
  const quick = smallTalk(q);
  if (quick) { addMsg(q, 'out'); addMsg(esc(quick), 'in'); return; }
  busy = true;
  $('send').disabled = true;
  addMsg(esc(q), 'out');
  qEl.value = '';
  statusEl.textContent = 'كنبحث...';

  if (/^[0-9+\-*/(). ]+$/.test(q)) {
    try {
      const r = Function('"use strict";return (' + q + ')')();
      addMsg('<div class="h">🧮 حساب</div>' + esc(q) + ' = ' + r, 'in');
      busy = false; $('send').disabled = false; statusEl.textContent = 'جاهز';
      return;
    } catch (e) {}
  }

  const prior = findPrior(q);
  const t = typing();
  let sources = [];
  try {
    sources = await gather(q, n => t.count(n));
    t.done();
    const data = synthesize(q, sources, prior);
    renderAnswer(q, data, prior);

    const rec = {
      q, topic: topicOf(q), idea: data.idea,
      points: data.points.map(p => p.text),
      urls: data.sorted.map(s => s.url).filter(Boolean),
      titles: data.sorted.map(s => s.title),
      at: Date.now()
    };
    memory.push(rec);
    if (memory.length > 200) memory = memory.slice(-200);
    persistMem();
    statusEl.textContent = 'جاهز · ' + memory.length + ' ذكرى';
  } catch (e) {
    t.done();
    addMsg('⚠️ وقع مشكل فالقراءة: ' + esc(e.message) + ' — عاود جرب.', 'in');
  }
  busy = false;
  $('send').disabled = false;
}

/* ===== الصوت ===== */
let rec = null, V = { on: false, base: '', cur: '', timer: null };
function dedupe(t) {
  let s = String(t || '').replace(/\s+/g, ' ').trim();
  for (let n = 8; n >= 2; n--) {
    const re = new RegExp('(\\S+(?: \\S+){' + (n - 1) + '})(?: \\1)+', 'g');
    s = s.replace(re, '$1');
  }
  return s.replace(/\s+/g, ' ').trim();
}
function vStop() {
  if (!V.on) return;
  V.on = false;
  clearTimeout(V.timer);
  $('vbar').classList.remove('on');
  $('mic').classList.add('rec');
  try { rec && rec.stop(); } catch (e) {}
  const said = dedupe(V.cur || '');
  setTimeout(() => {
    if (said.length > 2) ask(said);
    else addMsg('ما سمعت والو. عاود اضغط 🎙️ وقول سؤالك.', 'in');
  }, 120);
}
function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { addMsg('المتصفح ما كيدعمش الصوت. استعمل Chrome.', 'in'); return; }
  rec = new SR();
  rec.lang = 'ar';
  rec.continuous = true;
  rec.interimResults = true;
  V = { on: true, base: '', cur: '', timer: null };

  rec.onstart = () => {
    $('vbar').classList.add('on');
    $('vtxt').textContent = 'كنسمع... اهضر عادي';
    $('mic').classList.remove('rec');
  };
  rec.onresult = e => {
    let cur = '';
    for (let i = 0; i < e.results.length; i++) cur += e.results[i][0].transcript + ' ';
    const full = dedupe(((V.base ? V.base + ' ' : '') + cur).trim());
    V.cur = full;
    $('vtxt').textContent = full || 'كنسمع...';
    clearTimeout(V.timer);
    V.timer = setTimeout(vStop, 2400);
  };
  rec.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    $('vtxt').textContent = 'خطأ فالصوت: ' + e.error;
  };
  rec.onend = () => {
    if (V.on) { V.base = V.cur; try { rec.start(); } catch (e) {} }
    else { $('vbar').classList.remove('on'); $('mic').classList.remove('rec'); }
  };
  try { rec.start(); } catch (e) { addMsg('ما قدرتش نشعل الميكرو.', 'in'); }
}

function keywordsOf(sources) {
  const stop = new Set(['the', 'and', 'for', 'with', 'from', 'that', 'this', 'على', 'في', 'من', 'إلى', 'عن', 'التي', 'الذي', 'هذا', 'هذه', 'كان', 'كما', 'بين', 'أو', 'ثم', 'كل', 'بعد', 'قبل', 'غير', 'حتى', 'هو', 'هي']);
  const cnt = {};
  sources.forEach(s => {
    const words = clean((s.title || '') + ' ' + (s.text || '')).split(/[^\p{L}\p{N}]+/u);
    words.forEach(w => {
      const t = w.toLowerCase();
      if (t.length < 4 || stop.has(t) || /^\d+$/.test(t)) return;
      cnt[t] = (cnt[t] || 0) + 1;
    });
  });
  return Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 14).map(x => x[0]);
}
function renderReport() {
  const p = $('paneReport');
  if (!LAST) { p.innerHTML = '<div class="card">سول شي سؤال باش يبان التقرير هنا.</div>'; return; }
  const s = LAST.data.sorted;

  let bars = '';
  if (years.length > 2) {

    const bins = new Array(8).fill(0);
    years.forEach(y => { const i = Math.min(7, Math.floor(((y - min) / Math.max(1, max - min)) * 8)); bins[i]++; });
    const top = Math.max(...bins) || 1;
    bars = '<div class="bars">' + bins.map(b => '<i style="height:' + Math.max(3, (b / top) * 44) + 'px"></i>').join('') + '</div><div class="num">' + min + ' → ' + max + '</div>';
  }
  const kws = keywordsOf(s).map(k => '<span class="chip" data-kw="' + esc(k) + '">' + esc(k) + '</span>').join('');
  p.innerHTML =
    '<div class="card"><h4>السؤال</h4>' + esc(LAST.q) + '<br><span class="num">' + s.length + ' مصدر · ' + new Date(LAST.at).toLocaleString('ar-MA') + '</span></div>' +

    if (a === 'clr' && confirm('تمسح الذاكرة كاملة؟')) {
      memory = [];
      try { localStorage.removeItem('azzouz-mem-v3'); } catch (e) {}
      try { if (DB) DB.transaction('memories', 'readwrite').objectStore('memories').clear(); } catch (e) {}
      renderMemory();
    }
  });
}

/* ===== ربط ===== */
$('send').onclick = () => ask(qEl.value);
qEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(qEl.value); } });
$('mic').onclick = () => { if (V.on) vStop(); else startVoice(); };
$('mic2').onclick = $('mic').onclick;

$('tools').onclick = () => openTools('report');
$('shclose').onclick = () => sheet.classList.remove('on');
document.querySelectorAll('.stabs button').forEach(b => b.onclick = () => openTools(b.dataset.p));

statusEl.textContent = 'متصل · كنقرا من كل الويب';
