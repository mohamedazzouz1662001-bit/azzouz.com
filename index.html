<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>Azzouz — مساعد ذكي</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b141a; --panel:#202c33; --panel2:#111b21; --line:#2a3942;
  --out:#005c4b; --in:#202c33; --txt:#e9edef; --dim:#8696a0; --acc:#00a884; --tick:#53bdeb;
}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',Roboto,Tahoma,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(140deg,#00a884,#0b6b57);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#04241c}
.hd{flex:1;min-width:0}
.hd b{font-size:16px;display:block}
.hd span{font-size:11.5px;color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 rgba(0,168,132,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(0,168,132,0)}100%{box-shadow:0 0 0 0 rgba(0,168,132,0)}}
#log{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.day{align-self:center;background:#182229;color:var(--dim);font-size:11.5px;padding:3px 10px;border-radius:8px;margin:4px 0}
.msg{max-width:88%;padding:7px 9px 6px;border-radius:10px;font-size:14.5px;line-height:1.65;position:relative;word-wrap:break-word;white-space:pre-wrap;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.in{align-self:flex-start;background:var(--in);border-top-right-radius:3px}
.out{align-self:flex-end;background:var(--out);border-top-left-radius:3px}
.meta{display:flex;gap:5px;justify-content:flex-start;align-items:center;font-size:10.5px;color:rgba(233,237,239,.6);margin-top:3px}
.out .meta{justify-content:flex-end;color:rgba(233,237,239,.75)}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.act{background:#2a3942;border:none;color:var(--acc);font-size:11.5px;padding:4px 9px;border-radius:14px;cursor:pointer;font-family:inherit}
.act:active{background:#374b56}
.refs{display:block;margin-top:7px;border-top:1px solid var(--line);padding-top:6px;max-height:190px;overflow-y:auto;font-size:11.5px;color:var(--dim)}
.refs.all{max-height:420px}
.rhead{font-size:11.5px;color:#9fb3bd;margin-bottom:3px}
.refs a{color:#8ecdf7;text-decoration:none;display:block;padding:3px 0;line-height:1.5}
.typing{align-self:flex-start;background:var(--in);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--dim);display:flex;gap:8px;align-items:center;max-width:88%}
.dots{display:flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:bounce 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
footer{background:var(--panel);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
#q{flex:1;background:var(--panel2);border:none;border-radius:22px;color:var(--txt);padding:11px 14px;font-size:15px;font-family:inherit;resize:none;max-height:120px;line-height:1.5;outline:none}
#q::placeholder{color:#5f7078}
#send{width:44px;height:44px;border-radius:50%;border:none;background:var(--acc);color:#04241c;font-size:19px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#send:disabled{opacity:.45}
#mic{width:44px;height:44px;border-radius:50%;border:none;background:#2a3942;color:#e9edef;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#mic.rec{background:#c0392b;animation:micpulse 1.1s infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.55)}50%{box-shadow:0 0 0 9px rgba(192,57,43,0)}}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sugg button{background:#182229;border:1px solid #2a3942;color:#cfe4f0;font-size:12.5px;padding:8px 11px;border-radius:12px;text-align:right;font-family:inherit;cursor:pointer;line-height:1.5}
.sugg button:active{background:#22323c;border-color:var(--acc)}

/* كروت المراجع */
.rcard{display:flex;gap:9px;text-decoration:none;background:#182229;border:1px solid #22323c;border-radius:10px;padding:8px 9px;margin-bottom:6px;color:inherit}
.rcard:active{border-color:var(--acc)}
.rcard img{width:54px;height:54px;border-radius:7px;object-fit:cover;flex-shrink:0;background:#0e1a20}
.rcard .rb{min-width:0;flex:1}
.rtop{display:flex;gap:6px;align-items:center;font-size:10px;color:#7d8f99;margin-bottom:2px}
.rkind{background:#20323c;color:#8fd7c4;padding:1px 6px;border-radius:6px}
.rhost{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.rtitle{font-size:12.5px;color:#d9ecf5;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rsnip{font-size:11.5px;color:#93a7b2;line-height:1.5;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rtabs{display:flex;gap:5px;overflow-x:auto;padding:6px 0 4px;scrollbar-width:none}
.rtabs button{background:#182229;border:1px solid #22323c;color:#a8bcc7;font-size:11px;padding:4px 9px;border-radius:12px;font-family:inherit;white-space:nowrap;cursor:pointer}
.rtabs button.on{background:var(--acc);color:#04241c;border-color:var(--acc);font-weight:700}
/* سلسلة المراحل */
.chain{display:flex;flex-direction:column;gap:3px}
.crow{display:flex;gap:7px;align-items:center;font-size:11.5px;color:#7d8f99}
.crow i{width:7px;height:7px;border-radius:50%;background:#2f4450;flex-shrink:0}
.crow.act{color:#cfe4f0}
.crow.act i{background:var(--acc);animation:pulse 1.2s infinite}

/* نافذة كل المراجع */
.modal{position:fixed;inset:0;background:rgba(3,9,12,.78);display:none;z-index:50;padding:10px}
.modal.on{display:block}
.mbox{background:var(--bg);border:1px solid var(--line);border-radius:14px;height:100%;display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;align-items:center;gap:8px;padding:11px 13px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px}
.mhead b{flex:1}
.mclose{background:#2a3942;border:none;color:#e9edef;width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer}
.msearch{width:100%;background:var(--panel2);border:none;border-radius:10px;color:var(--txt);padding:9px 12px;font-family:inherit;font-size:13px;outline:none;margin:8px 12px 0;width:calc(100% - 24px)}
.mlist{flex:1;overflow-y:auto;padding:10px 12px}
.vbar{display:none;align-items:center;gap:9px;background:#182229;border-top:1px solid #2a3942;padding:9px 12px;font-size:12.5px;color:#cfe4f0}
.vbar.on{display:flex}
.vbar .dot{width:9px;height:9px;border-radius:50%;background:#e74c3c;animation:micpulse 1.1s infinite;flex-shrink:0}
.vbar .txt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar .stp{background:#c0392b;border:none;color:#fff;font-size:12px;padding:5px 11px;border-radius:14px;cursor:pointer;font-family:inherit}
.plug{width:30px;height:30px;border-radius:50%;background:#2a3942;border:none;color:#e9edef;font-size:14px;cursor:pointer;position:relative;flex-shrink:0;line-height:1}
.plug.on{background:#0b6b57}
.plug.on::after{content:'';position:absolute;top:1px;right:1px;width:8px;height:8px;border-radius:50%;background:#00e5a0;box-shadow:0 0 6px #00e5a0}
.sheet{position:fixed;left:0;right:0;bottom:0;height:86vh;background:var(--bg);border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(103%);transition:transform .25s ease;z-index:60;display:flex;flex-direction:column;box-shadow:0 -14px 34px rgba(0,0,0,.5)}
.sheet.on{transform:none}
.sh{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.sh b{flex:1;font-size:14px}
.shtabs{display:flex;gap:6px;padding:9px 12px;background:var(--panel2)}
.shtabs button{flex:1;background:#1b272e;border:1px solid #2a3942;color:#a8bcc7;font-size:12.5px;padding:7px;border-radius:10px;font-family:inherit;cursor:pointer}
.shtabs button.on{background:var(--acc);color:#04241c;border-color:var(--acc);font-weight:700}
.shbody{flex:1;overflow-y:auto;padding:10px 12px 18px}
.conn{background:#16222a;border:1px solid #22323c;border-radius:12px;padding:10px;margin-bottom:9px}
.ctop{display:flex;gap:8px;align-items:center}
.cico{width:30px;height:30px;border-radius:9px;background:#20323c;display:flex;align-items:center;justify-content:center;font-size:15px}
.cname{flex:1;min-width:0}
.cname b{font-size:13px}
.cname span{display:block;font-size:10.5px;color:#7d8f99;margin-top:1px}
.pill{font-size:10px;padding:2px 8px;border-radius:9px;background:#20323c;color:#7d8f99}
.pill.on{background:#0b6b57;color:#c9ffe9}
.cf{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.cf input{background:#0f1a20;border:1px solid #22323c;border-radius:8px;padding:8px 10px;color:var(--txt);font-family:inherit;font-size:12px;outline:none;width:100%}
.cf input:focus{border-color:var(--acc)}
.crow2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.crow2 button{background:#2a3942;border:none;color:#cfe4f0;font-size:11.5px;padding:6px 11px;border-radius:14px;font-family:inherit;cursor:pointer}
.crow2 button.pri{background:var(--acc);color:#04241c;font-weight:700}
.cnote{font-size:10.5px;color:#7d8f99;margin-top:6px;line-height:1.5}
.bstat{display:flex;gap:8px;margin-bottom:10px}
.bstat div{flex:1;background:#16222a;border:1px solid #22323c;border-radius:11px;padding:9px;text-align:center}
.bstat b{display:block;font-size:19px;color:#8fd7c4}
.bstat span{font-size:10.5px;color:#7d8f99}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:#20323c;color:#cfe4f0;font-size:11.5px;padding:5px 10px;border-radius:12px;cursor:pointer}
.bt{font-size:12px;color:#9fb3bd;margin:10px 0 4px}

.acct{background:#111b21;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.ahead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ahead>div{flex:1;min-width:0}
.ahead b{font-size:14px;display:block}
.ahead span{font-size:11.5px;color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aico{width:34px;height:34px;border-radius:50%;background:#fff;color:#4285f4;display:flex;align-items:center;justify-content:center;font-weight:800}
.apic{width:34px;height:34px;border-radius:50%;object-fit:cover}
.big{width:100%;padding:11px;font-size:13.5px;margin-bottom:6px}
.mini{background:#2a3942;color:#e9edef;border:none;border-radius:8px;padding:7px 10px;font-size:11.5px;cursor:pointer;text-decoration:none;display:inline-block}
.sw{width:44px;height:24px;border-radius:20px;background:#2a3942;border:none;position:relative;cursor:pointer;flex:0 0 auto}
.sw i{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#8696a0;transition:.16s}
.sw.on{background:var(--acc)}
.sw.on i{right:23px;background:#fff}
.adv{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.adv summary{font-size:12px;color:var(--dim);cursor:pointer;padding:6px 0}
input{width:100%;background:#111b21;border:1px solid var(--line);color:#e9edef;border-radius:8px;padding:9px;font-size:12.5px;margin-top:6px;font-family:inherit}

.foot{text-align:center;font-size:10.5px;color:#44555e;padding:0 0 6px;background:var(--panel)}
.foot a{color:#44555e;text-decoration:none}
</style>
</head>
<body>

  <div class="avatar">A</div>

    <span id="status">متصل · كيبحث دابما فالخلفية</span>

<script type="module">
import { deepAnswer } from './deep.mjs?v=7';
import { getArchived } from './archive.mjs?v=1';
import { SERVICES, KEY_CONNECTORS, anyOn, isOn as svcOn, setOn as svcSet, keyCfg, saveKeyCfg, keyOn, setKeyOn } from './connectors.mjs?v=2';
import { getClientId, setClientId, getSession, signIn, signOut, hasScope, SCOPES } from './auth.mjs?v=1';
import { brainStats, related } from './brain.mjs?v=1';
import { stats, backgroundTick, ensureSeeds, bgStats, setAuto, queueTopic } from './chat.mjs?v=7';

const log = document.getElementById('log');
const qEl = document.getElementById('q');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
let busy = false;

const now = () => new Date().toLocaleTimeString('ar-MA', { hour: '2-digit', minute: '2-digit' });

function dayLabel() {
  const d = document.createElement('div');
  d.className = 'day';
  d.textContent = new Date().toLocaleDateString('ar-MA', { weekday: 'long', day: 'numeric', month: 'long' });
  log.appendChild(d);
}
dayLabel();

function fmt(text) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc(String(text || ''))
    .replace(/\*([^*\n]+)\*/g, '<b>$1</b>')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:#8ecdf7">$1</a>');
}

function dedupeText(input) {
  let t = String(input || '').replace(/\s+/g, ' ').trim();
  if (!t) return '';
  let words = t.split(' ');
  // 1) كلمات مكررة جنب بعضها
  const seq = [];
  for (const w of words) if (!seq.length || seq[seq.length - 1] !== w) seq.push(w);
  words = seq;
  // 2) مقاطع مكررة (من 8 كلمات حتى 2) جنب بعضها
  let changed = true, guard = 0;
  while (changed && guard++ < 60) {
    changed = false;
    for (let n = Math.min(8, Math.floor(words.length / 2)); n >= 2; n--) {
      for (let i = 0; i + 2 * n <= words.length; i++) {
        const a = words.slice(i, i + n).join(' ');
        const b = words.slice(i + n, i + 2 * n).join(' ');
        if (a === b) {
          words = [...words.slice(0, i + n), ...words.slice(i + 2 * n)];
          changed = true;
          break;
        }
      }
      if (changed) break;
    }
  }
  return words.join(' ').trim();
}

function bubble(text, who = 'in') {
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  const body = document.createElement('div');
  body.innerHTML = fmt(text);
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = now() + (who === 'out' ? ' <span style="color:#53bdeb">✓✓</span>' : '');
  el.append(body, meta);
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function topicOf(text) {
  const t = String(text || '')
    .replace(/^(السلام عليكم|السلام|سلام|صباح الخير|صباح النور|مساء الخير|مساء النور|أهلا|اهلا|مرحبا|هاي)[،,.:\s]*/i, '')
    .replace(/^(بغيت نسولك|بغيت نسألك|عندي سؤال|سولك|نسولك)\s*/i, '')
    .replace(/^(على|عن|ف|في)\s+/i, '')
    .trim();
  return t.length > 2 ? t : String(text || '').trim();
}

function smallTalk(text) {
  const raw = String(text || '').trim();
  const t = raw.replace(/[!،,.؟?]+$/g, '').trim();
  const greet = /^(السلام|سلام|صباح الخير|صباح النور|مساء الخير|مساء النور|أهلا|اهلا|مرحبا|هاي|hello|hi)/i.test(t);
  const askIntent = /(بغيت نسولك|بغيت نسألك|عندي سؤال|سولك|نسولك|سؤال)/i.test(t);
  const stripped = t
    .replace(/^(السلام عليكم|السلام|سلام|صباح الخير|صباح النور|مساء الخير|مساء النور|أهلا|اهلا|مرحبا|هاي)\s*/i, '')
    .replace(/(بغيت نسولك|بغيت نسألك|عندي سؤال|نسولك|سولك|سؤال|على|عن|ف|في)/gi, ' ')
    .replace(/[^\p{L}\p{N}\s]/gu, ' ')
    .trim();
  const CHAT = new Set(['كيف', 'حالك', 'كيداير', 'داير', 'لباس', 'شكرا', 'بسلامة', 'نتا', 'سميتك', 'واخا', 'زعما', 'دابا', 'شي', 'حاجة', 'واش']);
  const topicWords = stripped.split(/\s+/).filter(w => w.length > 3 && !CHAT.has(w));
  const hasTopic = topicWords.length >= 1;
  if (hasTopic) return null;
  if (greet && askIntent) return 'وعليكم السلام 🌿 تفضل، سول براحتك وكنسمع.';
  if (greet) {
    if (/صباح/.test(t)) return 'صباح النور 🌿 كيفاش نقدر نعاونك اليوم؟';
    if (/مساء/.test(t)) return 'مساء النور 🌿 كيفاش نقدر نعاونك؟';
    return 'وعليكم السلام ورحمة الله 🌿 كيفاش نقدر نعاونك؟';
  }
  if (askIntent && t.split(/\s+/).length <= 6) return 'تفضل، سول براحتك — كنسمع.';
  if (/^(كيف حالك|كيداير|لباس|كيفك|labas)/i.test(t)) return 'الحمد لله، خدام كنبحث فالخلفية. ونتا كيف داير؟ 🌿';
  if (/^(شكرا|بارك الله|تبارك الله|merci|thanks)/i.test(t)) return 'على الرحب والسعة 🌿 أي وقت.';
  if (/^(بسلامة|سلام|إلى اللقاء|باي|bye)/i.test(t) && t.length < 14) return 'بسلامة الله 👋 إلا بغيتي شي حاجة أنا هنا.';
  if (/(شكون نتا|سميتك|من نتا|who are you)/i.test(t)) return 'أنا Azzouz 🌿 مساعد كيقرا فـ20+ محرك ومستودع، وكيعطيك الجواب أولا ومن بعد المراجع.';
  if (/^(واش كتفهمني|فهمتني|سمعتني)/i.test(t)) return 'واخا، فهمتك 🌿 كمل.';
  if (/(شحال|شحال من|عدد).*(بحث|بحوث|مصادر)/i.test(t)) {
    try {
      const s = stats();
      return 'دابا عندي ' + s.searches + ' بحث محفوظ و' + s.rules + ' قاعدة تعلمتها 🌿 وكنبحث فالخلفية بلا ما نوقف.';
    } catch (e) { return 'كنبحث دايماً فالخلفية 🌿'; }
  }
  if (/(شنو تعلمتي|شنو عرفتي|شنو قريتي|آخر بحث)/i.test(t)) {
    try {
      const d = (bgStats().done || []).slice(0, 3).map(x => x.topic);
      return d.length ? 'آخر اللي بحثت فيه: ' + d.join(' · ') + ' 🌿' : 'باقي كنبدا، سولني أي حاجة ونبحث.';
    } catch (e) { return 'كنبحث دايماً، سولني أي حاجة.'; }
  }
  return null;
}

const KIND = {
  paper: ['📄','بحث'], article: ['🌐','مقالة'], book: ['📚','كتاب'], code: ['💻','كود'],
  video: ['🎬','فيديو'], image: ['🖼️','صورة'], audio: ['🎧','صوت'], social: ['💬','نقاش'],
  news: ['📰','خبر'], study: ['🧪','تجربة'], place: ['📍','مكان'], data: ['🔢','بيانات'],
  archive: ['🗄️','أرشيف']
};

function hostOf(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
}

function refCard(r, i) {
  const k = KIND[r.kind] || KIND.article;
  const host = hostOf(r.url);
  const img = r.thumb ? '<img src="' + r.thumb + '" loading="lazy" alt="" onerror="this.remove()">' : '';
  const snip = r.snippet ? '<div class="rsnip">' + escapeHtml(r.snippet) + '</div>' : '';
  return '<a class="rcard" href="' + r.url + '" target="_blank" rel="noopener">' + img +
    '<div class="rb"><div class="rtop"><span class="rkind">' + k[0] + ' ' + k[1] + '</span>' +
    '<span class="rhost">' + host + '</span>' + (r.year ? '<span>' + r.year + '</span>' : '') + '</div>' +
    '<div class="rtitle">' + (i ? i + '. ' : '') + escapeHtml(String(r.title || r.url || '').slice(0, 140)) + '</div>' +
    snip + '</div></a>';
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

let modalRefs = [], modalList = [], modalShown = 0, modalKind = 'all', modalQ = '';

function renderModal(append) {
  const list = document.getElementById('mlist');
  const filtered = modalList.filter(r =>
    (modalKind === 'all' || r.kind === modalKind) &&
    (!modalQ || ((r.title || '') + ' ' + (r.snippet || '')).toLowerCase().includes(modalQ))
  );
  if (!append) { list.innerHTML = ''; modalShown = 0; modalRefs = filtered; }
  const slice = modalRefs.slice(modalShown, modalShown + 40);
  list.insertAdjacentHTML('beforeend', slice.map((r, i) => refCard(r, modalShown + i + 1)).join(''));
  modalShown += slice.length;
  let more = document.getElementById('mmore');
  if (!more) {
    more = document.createElement('button');
    more.id = 'mmore'; more.className = 'act'; more.style.margin = '4px auto 14px';
    more.onclick = () => renderModal(true);
    list.appendChild(more);
  }
  more.textContent = modalShown < modalRefs.length ? 'عرض المزيد (' + (modalRefs.length - modalShown) + ')' : 'وصلت للأخير';
  more.disabled = modalShown >= modalRefs.length;
}

function openRefs(refs, question) {
  modalList = refs;
  modalKind = 'all'; modalQ = '';
  document.getElementById('mtitle').textContent = 'المراجع (' + refs.length + ')';
  document.getElementById('msearch').value = '';
  const tabs = document.getElementById('mtabs');
  const counts = {};
  refs.forEach(r => {
    if (!KIND[r.kind]) r.kind = 'article';
    counts[r.kind] = (counts[r.kind] || 0) + 1;
  });
  const order = ['all', ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  tabs.innerHTML = order.map(k => {
    const label = k === 'all' ? 'الكل ' + refs.length : (KIND[k] ? KIND[k][0] + ' ' + KIND[k][1] : k) + ' ' + counts[k];
    return '<button data-kind="' + k + '" class="' + (k === 'all' ? 'on' : '') + '">' + label + '</button>';
  }).join('');
  tabs.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      tabs.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      modalKind = b.dataset.kind;
      renderModal(false);
    };
  });
  document.getElementById('modal').classList.add('on');
  renderModal(false);
  if (question) getArchived(question).then(a => {
    if (a && a.refs && a.refs.length > modalList.length) {
      modalList = a.refs;
      document.getElementById('mtitle').textContent = 'المراجع (' + a.refs.length + ')';
      renderModal(false);
    }
  });
}

function addActions(el, res) {
  const acts = document.createElement('div');
  acts.className = 'acts';

  if (res.refs && res.refs.length) {
    const refs = res.refs.slice().sort((a, b) => (a.n || 0) - (b.n || 0)).map((r, i) => ({ ...r, n: i + 1 }));
    const head = document.createElement('div');
    head.className = 'rhead';
    head.textContent = 'المراجع (عينة من ' + refs.length + ' مصدر):';
    el.append(head);

    const box = document.createElement('div');
    box.className = 'refs';
    box.style.maxHeight = 'none';
    box.innerHTML = refs.slice(0, 5).map((r, i) => refCard(r, r.n)).join('');
    el.append(box);

    const all = document.createElement('button');
    all.className = 'act';
    all.textContent = '📚 كل المراجع (' + refs.length + ')';
    all.onclick = () => openRefs(refs, res.question);
    acts.append(all);
  }

  const copy = document.createElement('button');
  copy.className = 'act';
  copy.textContent = '📋 نسخ';
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(res.text); copy.textContent = '✅ تنسخ'; }
    catch { copy.textContent = '⚠️ فشل'; }
    setTimeout(() => { copy.textContent = '📋 نسخ'; }, 1500);
  };
  acts.append(copy);

  if (acts.children.length) el.append(acts);
}

function addSuggestions(el, list) {
  if (!list || !list.length) return;
  const box = document.createElement('div');
  box.className = 'sugg';
  const lbl = document.createElement('div');
  lbl.className = 'lbl';
  lbl.textContent = 'اقتراحات للمتابعة:';
  box.append(lbl);
  list.slice(0, 3).forEach(text => {
    const b = document.createElement('button');
    b.textContent = text;
    b.onclick = () => {
      if (busy) return;
      qEl.value = text;
      qEl.focus();
      setTimeout(() => { submit(text); }, 180);
    };
    box.append(b);
  });
  el.append(box);
}

function typing() {
  const el = document.createElement('div');
  el.className = 'typing';
  el.innerHTML = '<div class="chain"></div>';
  const chain = el.querySelector('.chain');
  let cur = null;
  const add = txt => {
    if (cur) { cur.classList.remove('act'); cur.classList.add('done'); }
    const d = document.createElement('div');
    d.className = 'crow act';
    d.innerHTML = '<i></i><span>' + txt + '</span>';
    chain.appendChild(d);
    cur = d;
    log.scrollTop = log.scrollHeight;
    return d;
  };
  add('كنفكر فالسؤال...');
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return {
    stage: s => add(escapeHtml(s)),
    count: n => { if (cur) cur.querySelector('span').textContent = 'كنجمع المصادر · ' + n; },
    done: () => { if (cur) { cur.classList.remove('act'); cur.classList.add('done'); } el.remove(); }
  };
}

async function ask(text) {
  if (busy || !text.trim()) return;
  busy = true; sendBtn.disabled = true;
  bubble(text, 'out');

  const quick = smallTalk(text);
  if (quick) {
    const el = bubble(quick, 'in');
    void el;
    busy = false; sendBtn.disabled = false;
    return;
  }

  if (/^(السلام|سلام)/.test(text.trim())) bubble('وعليكم السلام ورحمة الله 🌿', 'in');

  const t = typing();
  try {
    const query = topicOf(text);
    const res = await deepAnswer(query, {
      onStage: s => t.stage(s),
      onCount: n => t.count(n)
    });
    t.done();
    const el = bubble(res.text, 'in');
    res.question = res.question || query;
    addActions(el, res);
    addSuggestions(el, res.suggestions);
    queueTopic(topicOf(text));
  } catch (e) {
    t.done();
    bubble('⚠️ وقع مشكل فالبحث: ' + e.message + '\nعاود جرب من بعد شوية.', 'in');
  }
  busy = false; sendBtn.disabled = false;
  log.scrollTop = log.scrollHeight;
}

function submit(text) {
  const v = String(text == null ? qEl.value : text).trim();
  qEl.value = ''; qEl.style.height = 'auto';
  if (v) ask(v);
}
sendBtn.onclick = () => submit();
qEl.addEventListener('keydown', e => {

});

});

function spark() {
  try {
    const done = (bgStats().done || []).slice(0, 12).reverse();
    const c = document.getElementById('spark');
    if (!c || !done.length) return;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);
    const max = Math.max(1, ...done.map(d => d.refs || 0));
    const w = c.width / done.length;
    done.forEach((d, i) => {
      const hgt = Math.max(2, ((d.refs || 0) / max) * (c.height - 2));
      ctx.fillStyle = 'rgba(0,168,132,.85)';
      ctx.fillRect(i * w + 1, c.height - hgt, Math.max(2, w - 2), hgt);
    });
  } catch (e) {}
}

const micBtn = document.getElementById('mic');
const vbar = document.getElementById('vbar');
const vtxt = document.getElementById('vtxt');

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function vStop(hard) {
  V.stopping = true;
  clearTimeout(V.timer);
  try { V.recog && V.recog.stop(); } catch (e) {}
  if (hard) V.on = false;
}

async function micPermission() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return true;
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    s.getTracks().forEach(t => t.stop());
    return true;
  } catch (e) { return false; }
}

function vFinish() {
  V.on = false; V.stopping = false;
  micBtn.classList.remove('rec');
  vbar.classList.remove('on');
  qEl.placeholder = 'كتب سؤالك...';
  statusEl.textContent = 'متصل · البحث الدائم خدام';
  const said = dedupeText(V.current || qEl.value || '');
  V.base = ''; V.current = '';
  if (said.length > 2) {
    qEl.value = said;
    submit(said);
  } else if (!V.errShown) {
    bubble('ما سمعت حتى كلمة. تأكد أن الميكرو مفتوح وأن الإنترنت خدام، وعاود اضغط 🎙.', 'in');
  }
  V.errShown = false;
}

function vHint(msg, err) {
  V.on = false; V.stopping = false;
  micBtn.classList.remove('rec');
  vbar.classList.remove('on');
  qEl.placeholder = 'كتب سؤالك...';
  statusEl.textContent = 'متصل · البحث الدائم خدام';
  if (err) V.errShown = true;
  bubble(msg, 'in');
}

micBtn.onclick = async () => {
  if (busy) return;
  if (!SR) {
    bubble('المتصفح ديالك ما كيدعمش التعرف على الصوت. حل الصفحة فـChrome، ولا كتب سؤالك باليد.', 'in');
    return;
  }
  if (V.on) { vStop(true); return; }

  V.on = true; V.stopping = false; V.base = ''; V.current = ''; V.errShown = false;
  micBtn.classList.add('rec');
  vbar.classList.add('on');
  vtxt.textContent = 'كنسمع... هضر عادياً';
  qEl.placeholder = 'كنسمع ليك...';
  statusEl.textContent = '🎙 كنسمع...';

  const ok = await micPermission();
  if (!ok) {
    vHint('خاصني إذن الميكرو. ضغط على 🔒 فجنب العنوان وسمح بالميكرو، ولا حلّ الصفحة فـChrome (ماشي فمتصفح الواتساب) وعاود.', true);
    return;
  }

  const rec = new SR();
  V.recog = rec;
  rec.lang = 'ar';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  rec.onstart = () => { vtxt.textContent = 'كنسمع... هضر'; };

  rec.onresult = e => {
    let cur = '';
    for (let i = 0; i < e.results.length; i++) {
      const alt = e.results[i][0];
      if (alt && alt.transcript) cur += alt.transcript + ' ';
    }
    const full = dedupeText(((V.base || '') + ' ' + cur).trim());
    V.current = full;
    vtxt.textContent = full || 'كنسمع... هضر';
    qEl.value = full;
    qEl.style.height = 'auto';
    qEl.style.height = Math.min(120, qEl.scrollHeight) + 'px';
    clearTimeout(V.timer);
    V.timer = setTimeout(() => vStop(), 2400);
  };

  rec.onerror = ev => {
    const e = ev.error;
    if (e === 'aborted') return;
    if (e === 'no-speech') { vStop(); return; }
    if (e === 'not-allowed' || e === 'service-not-allowed') {
      vHint('الإذن مرفوض. سمح بالميكرو لهاد الموقع من إعدادات المتصفح (🔒 فجنب العنوان) وعاود.', true);
    } else if (e === 'audio-capture') {
      vHint('ما لقيتش ميكرو. تأكد أن ميكرو الجهاز خدام.', true);
    } else if (e === 'network') {
      vHint('خدمة الصوت ما قدرتش تتصل بالإنترنت. تأكد من الشبكة ولا جرب Chrome.', true);
    } else if (e === 'language-not-supported') {
      try { rec.lang = 'ar-MA'; rec.start(); return; } catch (x) {}
      vHint('المتصفح ما كيدعمش العربية فالصوت. جرب Chrome.', true);
    } else {
      vHint('تعذر السمع (الخطأ: ' + e + '). كتب سؤالك باليد ولا عاود جرب.', true);
    }
  };

  rec.onend = () => {
    if (V.on && !V.stopping) {
      V.base = V.current || V.base;
      try { rec.start(); return; } catch (e) {}
    }
    vFinish();
  };

  try { rec.start(); } catch (e) {
    vHint('ما قدرتش نبدا التسجيل: ' + e.message, true);
  }
};

vstop.onclick = () => vStop();

    spark();
  } catch (e) {

  }
  setTimeout(loopBackground, 45000);
}
